name: R002 integrity promotion

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.head.ref == 'research/r002-cauchy-rigor' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r002-cauchy-rigor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Bind resolution and apply verified critic changes
        run: |
          python scripts/bind_resolution.py R002
          python scripts/promote_verified.py R002 --apply
      - name: Commit promotion artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/packets/R002-* research/resolutions/R002-* research/promotions/R002-*
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Bind and apply verified R002 research review'
            git push origin HEAD:research/r002-cauchy-rigor
          fi
