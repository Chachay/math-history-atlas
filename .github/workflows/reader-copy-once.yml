name: Reader copy one-shot
on:
  push:
    branches: [ui/reader-facing-hero-copy]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Apply reader-facing copy migration
        run: python scripts/apply_reader_copy_once.py
      - name: Validate and build
        run: |
          python scripts/validate.py
          python scripts/build.py
      - name: Commit implementation and remove one-shot runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Atlas, Network, and Story heroes reader-facing"
          git push
