name: R006 integrity promotion

on:
  push:
    branches:
      - research/r006-solvability-permutations-galois

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r006-solvability-permutations-galois
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m scripts.bind_resolution R006
      - run: python -m scripts.promote_verified R006
      - run: python -m scripts.promote_verified R006 --apply
      - name: Commit integrity-bound artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/packets/R006-*.yaml research/resolutions/R006-*.yaml research/promotions/R006-*.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Bind and apply R006 research resolution"
            git push origin HEAD:research/r006-solvability-permutations-galois
          fi
