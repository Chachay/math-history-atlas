name: Research Unit Ops

on:
  workflow_dispatch:
    inputs:
      unit_id:
        description: Research unit ID, e.g. R009
        required: true
        type: string
      ref:
        description: Branch/ref containing the research unit artifacts
        required: true
        type: string
      operation:
        description: Repository operation to run
        required: true
        type: choice
        options:
          - status
          - check
          - bind
          - promote-dry-run
          - promote-apply
          - canonical-plan

permissions:
  contents: write

jobs:
  research-unit-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - name: Run requested operation
        shell: bash
        env:
          UNIT_ID: ${{ inputs.unit_id }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "$OPERATION" in
            status)
              python -m scripts.research_unit_status "$UNIT_ID"
              ;;
            check)
              packets=(research/packets/${UNIT_ID}-*.yaml)
              reviews=(research/reviews/${UNIT_ID}-*.yaml)
              if [[ ${#packets[@]} -ne 1 || ${#reviews[@]} -ne 1 ]]; then
                echo "Expected exactly one packet and review for $UNIT_ID" >&2
                exit 1
              fi
              python -m scripts.check_research_artifact "${packets[0]}"
              python -m scripts.check_research_artifact "${reviews[0]}"
              ;;
            bind)
              python -m scripts.bind_resolution "$UNIT_ID"
              ;;
            promote-dry-run)
              python -m scripts.promote_verified "$UNIT_ID"
              ;;
            promote-apply)
              python -m scripts.promote_verified "$UNIT_ID"
              python -m scripts.promote_verified "$UNIT_ID" --apply
              ;;
            canonical-plan)
              python -m scripts.plan_canonical_promotion "$UNIT_ID"
              ;;
            *)
              echo "Unknown operation: $OPERATION" >&2
              exit 2
              ;;
          esac

      - name: Commit repository mutations
        if: inputs.operation == 'bind' || inputs.operation == 'promote-apply'
        shell: bash
        env:
          UNIT_ID: ${{ inputs.unit_id }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/resolutions/${UNIT_ID}-*-resolution.yaml
          git add -- research/packets/${UNIT_ID}-*.yaml
          git add -- research/promotions/${UNIT_ID}-*-promotion.yaml
          if git diff --cached --quiet; then
            echo "No repository mutations to commit"
          else
            git commit -m "${UNIT_ID}: ${OPERATION} via Research Unit Ops"
            git push origin "HEAD:${TARGET_REF}"
          fi
