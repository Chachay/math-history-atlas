name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Fetch current target branch and determine effective PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          python -m scripts.pr_preview_diff \
            --base "origin/${BASE_REF}" \
            --head "${HEAD_SHA}" \
            --output .pr-preview-diff.yaml

      - name: Merge current target branch for final checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "origin/${BASE_REF}"

      - run: python scripts/validate.py
      - run: python scripts/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund
        working-directory: app

      - run: npm run build
        working-directory: app

      - name: Build mobile review links
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          import yaml

          pr = os.environ['PR_NUMBER']
          owner, repo = os.environ['REPOSITORY'].split('/', 1)
          base_ref = os.environ['BASE_REF']
          preview = f"https://{owner.lower()}.github.io/{repo}/pr-{pr}/"
          diff = yaml.safe_load(Path('.pr-preview-diff.yaml').read_text(encoding='utf-8'))
          changed = diff.get('changed_files', [])
          behind = int(diff.get('behind', 0))

          stories = []
          seen = set()
          for name in changed:
              if not name.startswith('editorial/stories/') or not name.endswith(('.yaml', '.yml')):
                  continue
              path = Path(name)
              if not path.exists():
                  continue
              rows = yaml.safe_load(path.read_text(encoding='utf-8')) or []
              if isinstance(rows, dict):
                  rows = [rows]
              for row in rows:
                  if not isinstance(row, dict) or not row.get('id') or row['id'] in seen:
                      continue
                  seen.add(row['id'])
                  stories.append((row['id'], row.get('title', row['id'])))

          if behind:
              base_status = (
                  f"⚠️ Branch is behind `{base_ref}` by {behind} commit(s). "
                  "This preview and its validation/build include the current target branch via a temporary merge."
              )
          else:
              base_status = f"✅ Branch is current with `{base_ref}`."

          lines = [
              f"📱 **PR preview:** [Open app]({preview})",
              '',
              base_status,
              '',
              '**Quick review**',
              f"- [Atlas]({preview}#/atlas)",
              f"- [Network]({preview}#/network)",
          ]

          if stories:
              lines.extend(['', '**Changed Stories**'])
              for story_id, title in stories:
                  sid = quote(story_id, safe='')
                  lines.append(
                      f"- **{title}** — [Story]({preview}#/story/{sid}) · "
                      f"[Network context]({preview}#/network?story={sid})"
                  )

          Path('.pr-preview-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Deploy preview to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: app/dist
          target-folder: pr-${{ github.event.pull_request.number }}
          clean: false

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo.repo;
            const pr = context.issue.number;
            const marker = '<!-- pr-preview-url -->';
            const reviewLinks = fs.readFileSync('.pr-preview-comment.md', 'utf8').trim();
            const body = `${marker}\n${reviewLinks}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo,
                issue_number: pr,
                body,
              });
            }
