name: R008 integrity temp
on:
  push:
    branches: [research/r008-cantor-uniqueness-point-sets]
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r008-cantor-uniqueness-point-sets
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Fix packet YAML quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/packets/R008-cantor-uniqueness-point-sets.yaml')
          s = p.read_text(encoding='utf-8')
          old = '    original_title: Notiz zu dem Aufsatze: Beweis, dass eine für jeden reellen Werth von x durch eine trigonometrische Reihe gegebene Function f(x) sich nur auf eine einzige Weise in dieser Form darstellen lässt\n'
          new = '    original_title: "Notiz zu dem Aufsatze: Beweis, dass eine für jeden reellen Werth von x durch eine trigonometrische Reihe gegebene Function f(x) sich nur auf eine einzige Weise in dieser Form darstellen lässt"\n'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - run: python -m scripts.bind_resolution R008
      - run: cat research/resolutions/R008-cantor-uniqueness-point-sets-resolution.yaml
      - name: Commit binding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/packets/R008-cantor-uniqueness-point-sets.yaml research/resolutions/R008-cantor-uniqueness-point-sets-resolution.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R008: fix packet YAML and bind resolution'
          git push origin HEAD:research/r008-cantor-uniqueness-point-sets
