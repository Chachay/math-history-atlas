name: R008 integrity temp
on:
  push:
    branches: [research/r008-cantor-uniqueness-point-sets]
  pull_request:
    branches: [main]
jobs:
  bind:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m scripts.bind_resolution R008
      - run: cat research/resolutions/R008-cantor-uniqueness-point-sets-resolution.yaml
