name: R008 promotion temp
on:
  push:
    branches: [research/r008-cantor-uniqueness-point-sets]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r008-cantor-uniqueness-point-sets
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m scripts.promote_verified R008
      - run: python -m scripts.promote_verified R008 --apply
      - name: Commit verified promotion artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/packets/R008-cantor-uniqueness-point-sets.yaml research/promotions/R008-cantor-uniqueness-point-sets-promotion.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R008: apply verified research resolution'
          git push origin HEAD:research/r008-cantor-uniqueness-point-sets
