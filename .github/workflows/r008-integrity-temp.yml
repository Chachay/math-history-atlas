name: R008 promotion temp
on:
  pull_request:
    branches: [main]
jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m scripts.promote_verified R008
      - run: python -m scripts.promote_verified R008 --apply
      - run: git diff -- research/packets/R008-cantor-uniqueness-point-sets.yaml research/promotions/R008-cantor-uniqueness-point-sets-promotion.yaml
