name: R005 integrity and promotion

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/packets/R005-epsilon-delta-rigor.yaml'
      - 'research/reviews/R005-epsilon-delta-rigor-review.yaml'
      - 'research/resolutions/R005-epsilon-delta-rigor-resolution.yaml'
      - '.github/workflows/r005-integrity.yml'

permissions:
  contents: write

jobs:
  bind-and-promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/r005-epsilon-delta-rigor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Normalize accepted R005 locator patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          packet_path = Path('research/packets/R005-epsilon-delta-rigor.yaml')
          review_path = Path('research/reviews/R005-epsilon-delta-rigor-review.yaml')
          packet = yaml.safe_load(packet_path.read_text(encoding='utf-8'))
          review = yaml.safe_load(review_path.read_text(encoding='utf-8'))
          locator = "Septième Leçon; Oeuvres complètes, series 2, vol. 4, pp. 44–45"

          for row in packet.get('chronology', []):
              if str(row.get('date')) == '1823':
                  row['primary_locator'] = locator
          for row in packet.get('assertions', []):
              if row.get('id') == 'r005-a003':
                  row['primary_locator'] = locator

          for finding in review.get('findings', []):
              if finding.get('id') in {'hr-r005-chronology-1823', 'hr-r005-a003'}:
                  finding['proposed_change'] = {
                      'action': 'replace_fields',
                      'fields': {'primary_locator': locator},
                  }

          packet_path.write_text(yaml.safe_dump(packet, sort_keys=False, allow_unicode=True, width=100), encoding='utf-8')
          review_path.write_text(yaml.safe_dump(review, sort_keys=False, allow_unicode=True, width=100), encoding='utf-8')
          PY
      - name: Bind exact research artifacts
        run: python -m scripts.bind_resolution R005
      - name: Verify promotion proposal
        run: python -m scripts.promote_verified R005
      - name: Apply accepted safe changes
        run: python -m scripts.promote_verified R005 --apply
      - name: Re-bind after accepted packet changes
        run: python -m scripts.bind_resolution R005
      - name: Verify final bound state
        run: python -m scripts.promote_verified R005
      - name: Commit generated research artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/packets/R005-epsilon-delta-rigor.yaml research/reviews/R005-epsilon-delta-rigor-review.yaml research/resolutions/R005-epsilon-delta-rigor-resolution.yaml research/promotions/R005-epsilon-delta-rigor-promotion.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'Bind and apply R005 research resolution'
            git push
          fi
