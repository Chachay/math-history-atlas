research_gaps:
  - id: gap-r007-story-geodesy
    question: What documentary evidence establishes how Gauss himself connected the Hanover survey and geodetic work to the development of the Theorema Egregium?
    needed_evidence: Gauss correspondence, notebooks, geodetic publications, or specialist historiography tracing the research transition rather than chronology alone.
  - id: gap-r007-story-riemann
    question: What historically documented transmission path connects Gauss's 1827 surface theory to Riemann's 1854 higher-dimensional metric geometry?
    needed_evidence: Riemann manuscripts and lecture context, institutional evidence, or specialist studies identifying the conceptual channels and necessary intermediaries.
