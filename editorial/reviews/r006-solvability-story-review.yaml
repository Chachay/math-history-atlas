      step_id: solvability-5
      field: perspective
    reason: >
      The first part of the step describes Galois's historical problem and terminology, but the final clause
      explicitly compares those notions with the later abstract group concept and modern textbook theorem.
      Because the step as a whole performs that retrospective distinction, historical is too narrow a perspective.
    assertion_refs: [assertion-r006-galois-reframing, assertion-r006-galois-substitution-structure, assertion-r006-galois-root-permutations]
    proposed_change:
      action: replace_perspective
