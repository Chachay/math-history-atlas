research_gaps:
  - id: gap-r005-schwarz-direct
    question: What stable direct edition or archive locator best supports the 1861 Schwarz lecture-note passage?
    needed_evidence: Dugac's transcription or the Mittag-Leffler manuscript with a page or folio locator and independent specialist comparison.
  - id: gap-r005-arithmetization
    question: Can arithmetization of analysis be tied to a contemporary Weierstrass text rather than only later historiography?
    needed_evidence: Primary programmatic evidence; otherwise the phrase remains later interpretation.
