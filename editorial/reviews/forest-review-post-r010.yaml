human_gate:
  required: true
  recommendation: >
    Treat the Network projection repair as the only P0 action. Re-evaluate the Story-level synthesis queue against
    the stable Question-first graph before editing Stories or allocating the next Research Unit. Keep R011
    unassigned during this implementation and review pass.
  questions:
    - Should the Question-first heterogeneous Network projection be implemented before any Story synthesis?
    - After that projection, which Story overlaps remain genuine reader-facing duplication rather than UI amplification?
    - Which supplementary research items are worth doing before extending a trunk?
    - Which candidate, if any, should receive the next roadmap-controlled R-number?
