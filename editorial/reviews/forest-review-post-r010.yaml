      Replace the Story-lane coordinate model with a Question-first heterogeneous graph projection. Story membership
      must stop determining x-position; Stories should become overlays on a stable graph. This is a reader-facing
      semantic defect, not cosmetic cleanup, because the current layout can make editorial membership look like
      mathematical or historical topology.
