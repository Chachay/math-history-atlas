research_gaps:
  - id: gap-r008-story-heine-cantor
    question: What primary evidence fixes the detailed direction of suggestions exchanged by Heine and Cantor around the uniqueness generalizations?
    needed_evidence: Cantor–Heine correspondence, Heine's full relevant passage, or specialist quotation of the primary exchange.
  - id: gap-r008-story-riemann-schwarz
    question: Which precise Riemann result and Schwarz lemma enter Cantor's 1870 proof?
    needed_evidence: Proof-level primary or specialist locators before adding a canonical Riemann-to-Cantor edge.
  - id: gap-r008-story-post1872
    question: What historically documented path connects the 1872 finite derived-set analysis to Cantor's 1873–1874 work on infinite totalities?
    needed_evidence: Cantor's 1873 correspondence, the 1874 paper, and specialist historiography in a later bounded unit.
