- id: story-function
  title: Must a function be given by one analytic expression?
  description: >
    A focused path from the representational demands exposed by Fourier's work to nineteenth-century attempts to
    separate numerical dependence from a single analytic law, and then to the distinct question of which functions
    are admissible for integration and trigonometric representation.
  question_phases:
  - q-trig-representation-scope
  - q-what-is-function
  - q-dirichlet-admissible-functions
  fields: [analysis]
  steps:
    - id: function-1
      ref: q-trig-representation-scope
      role: Handoff
      narrative: >
        Fourier's representation problem required mathematics to handle prescribed data that need not be given by
        one analytic formula. Read retrospectively, that pressure opens a distinct question about the mathematical
        object being represented: what should count as a function when one common analytic law is no longer required?
      assertion_refs:
        - assertion-r001-arbitrary-function
        - assertion-r001-function-concept
      perspective: later_interpretation
      temporal_anchor: {from: 1807, to: 1822}
    - id: function-2
      ref: concept-arbitrary-function
      role: Broader object
      narrative: >
        Fourier described functions through arbitrarily drawn ordinates and allowed cases not governed by one common
        analytic law over an interval. This broadened the practical class of objects used in analysis without amounting
        to a modern set-theoretic definition of function.
      assertion_refs:
        - assertion-r001-arbitrary-function
      perspective: historical
      temporal_anchor: {from: 1807, to: 1822}
    - id: function-3
      ref: concept-discontinuous-function
      role: Boundary test
      narrative: >
        Dirichlet's 1829 discussion sharpened a different boundary. A numerical assignment can have finite determined
        values while still failing the conditions needed for the definite integrals used in Fourier coefficients.
        Being a function and being analytically admissible for a particular operation are therefore not the same question.
      assertion_refs:
        - assertion-r003-dirichlet-arbitrary-admissibility
        - assertion-r003-dirichlet-discontinuity
        - assertion-r003-dirichlet-integral-boundary
      perspective: historical
      temporal_anchor: {from: 1829, to: 1829}
    - id: function-4
      ref: work-dirichlet-1837
      role: New formulation
      narrative: >
        In 1837 Dirichlet described a continuous function on an interval without requiring one common law over the
        whole interval or dependence expressible by mathematical operations. Later historians treat this as an
        important stage in the changing function concept, not as a unique invention of the modern definition.
      assertion_refs:
        - assertion-r003-dirichlet-1837-function
        - assertion-r003-function-historiography
      perspective: later_interpretation
      temporal_anchor: {from: 1837, to: 1837}
    - id: function-5
      ref: q-dirichlet-admissible-functions
      role: Next question
      narrative: >
        Once the class of functions is allowed to extend beyond one analytic expression, analysis still needs to
        decide which of those functions can legitimately enter operations such as definite integration and
        trigonometric representation. That is a separate mathematical problem, handed off to the integrability Story.
      assertion_refs:
        - assertion-r003-downstream-admissibility
        - assertion-r003-dirichlet-integral-boundary
      perspective: later_interpretation
      temporal_anchor: {from: 1837, to: 1837}
  links:
