- id: story-cauchy-rigor-continuity
  title: When does continuity survive an infinite limit?
  description: >
    A mathematical path from convergence of infinite processes to the failure of continuity under an inadequately
    controlled limit, and then to stronger conditions later organized as uniform convergence. Cauchy, Abel, Stokes,
    Seidel, and Weierstrass appear as interventions in that problem rather than as the Story's primary subject.
  question_phases:
  - q-series-convergence
  - q-continuity-under-limits
  - q-uniform-convergence-emergence
  fields:
  - analysis
  steps:
  - id: r002-story-1
    ref: q-series-convergence
    role: Mathematical setting
    narrative: >
      Infinite series force analysis to distinguish formal manipulation from a genuinely convergent limiting process.
      Cauchy's 1821 work made convergence conditions part of a systematic treatment of analysis and supplied one
      important historical setting in which the behavior of limits became a mathematical object in its own right.
    assertion_refs:
    - assertion-r002-cauchy-convergence
    - assertion-r002-cauchy-rigor
    perspective: later_interpretation
    temporal_anchor: {from: 1821, to: 1821}
  - id: r002-story-2
    ref: q-continuity-under-limits
    role: Preservation problem
    narrative: >
      A deeper question appears when every term in an infinite process has a property such as continuity: does the
      limit necessarily preserve it? Cauchy's 1821 theorem on sums of continuous functions asserted too much at this
      point, and later counterexample episodes showed that convergence alone was not enough.
    assertion_refs:
    - assertion-r002-sum-continuity-problem
    - assertion-r002-abel-continuity
    perspective: later_interpretation
    temporal_anchor: {from: 1821, to: 1826}
  - id: r002-story-3
    ref: concept-fourier-series
    role: Stress test
    narrative: >
      Trigonometric series supplied a demanding concrete setting for the same issue. Cauchy's 1826/1827 memoir tried
      to control convergence of periodic sine and cosine expansions used in mathematical physics, intersecting the
      Fourier representation line without making that physical problem the cause of Cauchy's broader analysis program.
    assertion_refs:
    - assertion-r002-periodic-fourier
    - assertion-r002-periodic-convergence
    perspective: later_interpretation
    temporal_anchor: {from: 1827, to: 1827}
  - id: r002-story-4
    ref: work-cauchy-series-1853
    role: Stronger control
    narrative: >
      In 1853 Cauchy returned to the continuity-of-the-sum problem, acknowledged exceptions to the earlier general
      claim, and required stronger control of the remainder across the range of the variable. This strengthened form
      became part of the later development of what is now called uniform convergence.
    assertion_refs:
    - assertion-r002-cauchy-1853-continuity
    - assertion-r002-cauchy-1853-uniform
    perspective: later_interpretation
    temporal_anchor: {from: 1853, to: 1853}
  - id: r002-story-5
    ref: q-uniform-convergence-emergence
    role: Next question
    narrative: >
      The mathematical problem has now changed from whether a limit exists to how strongly the approximation must be
      controlled across the variable in order to preserve properties of the limiting function. Work by Cauchy, Stokes,
      Seidel, and Weierstrass was later organized under the concept of uniform convergence, a distributed clarification
      rather than a single linear invention chain.
    assertion_refs:
    - assertion-r002-cauchy-1853-uniform
    - assertion-r002-stokes-uniform
    - assertion-r002-seidel-uniform
    - assertion-r002-weierstrass-uniform
    perspective: later_interpretation
    temporal_anchor: {from: 1853, to: 1860}
  links:
