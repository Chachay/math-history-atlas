- id: story-fourier-heat-representation
  title: From special solutions to trigonometric representation
  description: >
    A mathematical path from Fourier's heat equation and prescribed physical data to trigonometric solution forms,
    superposition, and the problem of representing general temperature distributions. Heat is the historical origin;
    the Story's mathematical protagonist is the construction of general solutions from special ones.
  question_phases:
  - q-heat-propagation
  - q-heat-prescribed-data
  - q-trig-representation-scope
  fields:
  - analysis
  - mathematical-physics
  steps:
  - id: r001-story-1
    ref: q-heat-propagation
    role: Historical origin
    narrative: >
      Fourier's heat research asked how a temperature distribution changes through a solid over space and time.
      His mathematical treatment expressed that evolution through differential equations rather than treating the
      temperature of a body as a single quantity.
    assertion_refs:
    - assertion-r001-fourier-heat-problem
    - assertion-r001-heat-data-to-series
    perspective: historical
    temporal_anchor: {from: 1807, to: 1822}
  - id: r001-story-2
    ref: problem-heat-boundary-data
    role: Mathematical problem
    narrative: >
      The differential equation alone does not specify a particular heat evolution. Geometry, boundary interaction,
      and the initially prescribed temperature distribution determine the concrete problem that has to be solved.
      In modern terminology this is an initial-and-boundary-value problem, although that later vocabulary is not
      attributed to Fourier.
    assertion_refs:
    - assertion-r001-heat-data-to-series
    perspective: historical
    temporal_anchor: {from: 1807, to: 1822}
  - id: r001-story-3
    ref: concept-fourier-series
    role: Solution structure
    narrative: >
      In Fourier's heat equations, separated solutions supplied sinusoidal spatial forms. Because the equation is
      linear, combinations of such trigonometric solutions could be used to match prescribed temperature data.
      The trigonometric series therefore entered as part of the mathematical structure of solving the heat problem,
      not as an unrelated representation technique added afterward.
    assertion_refs:
    - assertion-r001-heat-data-to-series
    - assertion-r001-series-representation-question
    perspective: historical
    temporal_anchor: {from: 1807, to: 1822}
  - id: r001-story-4
    ref: q-trig-representation-scope
    role: Representation problem
    narrative: >
      Once special trigonometric solutions are combined, the method requires answering a further mathematical
      question: which prescribed spatial distributions can actually be represented by such a trigonometric expansion?
      Fourier's heat theory thus turns the construction of a solution into a problem about the scope of representation.
    assertion_refs:
    - assertion-r001-series-representation-question
    - assertion-r001-heat-data-to-series
    perspective: historical
    temporal_anchor: {from: 1807, to: 1822}
  - id: r001-story-5
    ref: concept-arbitrary-function
    role: Broad response
    narrative: >
      Fourier treated that scope broadly, including functions specified by arbitrary curves and functions not governed
      by one analytic law throughout an interval. This is a historically specific claim about the data his method was
      meant to represent, not a claim that Fourier already possessed the modern set-theoretic concept of function.
    assertion_refs:
    - assertion-r001-arbitrary-function
    perspective: historical
    temporal_anchor: {from: 1807, to: 1822}
  - id: r001-story-6
    ref: q-trig-representation-scope
    role: Branch point
    narrative: >
      The broad representation claim does not settle all of the mathematics. From this point the Atlas can ask
      separately what kinds of objects count as functions and under what conditions the resulting series converges.
      Those are downstream branches from the representation problem rather than additional chapters of the heat Story.
    assertion_refs:
    - assertion-r001-function-concept
    - assertion-r001-series-to-convergence
    perspective: later_interpretation
    temporal_anchor: {from: 1822, to: 1829}
  links:
  - {from: r001-story-1, to: r001-story-2, type: continues}
  - {from: r001-story-2, to: r001-story-3, type: continues}
