- id: story-fourier-heat-representation
  title: From heat to arbitrary functions
  description: How Fourier's heat problem led from prescribed temperature data to trigonometric representation, convergence, and broader questions about functions.
  question_phases: [q-heat-propagation, q-heat-prescribed-data, q-trig-representation-scope, q-fourier-series-convergence, q-what-is-function]
  fields: [analysis, mathematical-physics]
  steps:
    - id: r001-story-1
      ref: q-heat-propagation
      role: Question
      narrative: >
        Fourier's work began from a physical problem: how temperature changes and heat propagates through solid bodies.
        The aim was not initially to study trigonometric series for their own sake, but to build a mathematical theory of heat that could describe such changes.
      assertion_refs: [assertion-r001-fourier-heat-problem]
      perspective: historical
    - id: r001-story-2
      ref: problem-heat-boundary-data
      role: Problem
      narrative: >
        A differential equation alone does not determine a physical temperature history.
        The calculation must also accommodate the temperature distribution from which the body starts and the conditions imposed at its boundaries.
      assertion_refs: [assertion-r001-heat-data-to-series]
      perspective: historical
    - id: r001-story-3
      ref: concept-fourier-series
      role: Response
      narrative: >
        Trigonometric expansions supplied a way to connect the mathematical solutions of the heat equation with prescribed temperature data.
        In Fourier's treatment, this representational step became central to solving concrete heat problems.
      assertion_refs: [assertion-r001-heat-data-to-series, assertion-r001-series-representation-question]
      perspective: historical
    - id: r001-story-4
      ref: q-trig-representation-scope
      role: Remaining gap
      narrative: >
        The method immediately raised a harder question: which temperature distributions could actually be represented by such trigonometric series?
        The issue was not merely computational, because the admissible data need not be given by one simple analytic formula.
      assertion_refs: [assertion-r001-series-representation-question, assertion-r001-arbitrary-function]
      perspective: historical
    - id: r001-story-5
      ref: concept-arbitrary-function
      role: Response
      narrative: >
        Fourier treated the representational scope broadly, including functions specified by arbitrary curves and functions that need not obey a single analytic law throughout an interval.
        This broadened what the heat problem demanded from the language of functions, without yet supplying a modern set-theoretic definition of function.
      assertion_refs: [assertion-r001-arbitrary-function]
      perspective: historical
    - id: r001-story-6
      ref: q-fourier-series-convergence
      role: Next question
      narrative: >
        Representation and convergence are not the same claim.
        Once Fourier's method associated broad classes of functions with trigonometric series, a separate question became unavoidable: under what conditions does the series actually converge to the intended function?
      assertion_refs: [assertion-r001-series-to-convergence]
      perspective: later_interpretation
    - id: r001-story-7
      ref: work-dirichlet-1829
      role: Response
      narrative: >
        Dirichlet's 1829 work gave a rigorous convergence result under explicit restrictions rather than accepting unrestricted convergence as automatic.
        It marks an important shift from using Fourier expansions successfully to stating conditions under which their convergence can be proved.
      assertion_refs: [assertion-r001-dirichlet-convergence]
      perspective: historical
    - id: r001-story-8
      ref: q-what-is-function
      role: Next question
      narrative: >
        From a later historical perspective, the Fourier-series episode also became part of a broader transformation in the concept of function.
        The connection should not be read as a single direct causal chain, but Fourier's representational problems helped make the admissible class of functions itself a mathematical question.
      assertion_refs: [assertion-r001-function-concept]
      perspective: later_interpretation
