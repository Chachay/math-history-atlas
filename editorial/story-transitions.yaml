- id: transition-r001-r003-convergence
  from_story: story-fourier-heat-representation
  from_step: r001-story-7
  to_story: story-function
  to_step: function-2
  type: handoff
  perspective: historical
  assertion_refs:
    - assertion-r001-dirichlet-convergence
    - assertion-r003-dirichlet-convergence
  rationale: >
    R001 reaches Dirichlet's 1829 convergence result as a response to Fourier-series convergence;
    R003 re-enters the same 1829 episode to examine what the convergence restrictions imply for
    admissible functions. This is a local handoff, not a claim that the whole function-concept story
    follows inevitably from Fourier.

- id: transition-r002-r003-cauchy-dirichlet
  from_story: story-cauchy-rigor-continuity
  from_step: r002-story-5
  to_story: story-function
  to_step: function-2
  type: handoff
  perspective: historical
  assertion_refs:
    - assertion-r003-dirichlet-fourier-cauchy
  rationale: >
    Dirichlet's 1829 opening explicitly places his convergence work after Fourier and in criticism of
    Cauchy's attempted periodic-series proof, so this bridge is supported by a contemporary textual relation.

- id: transition-r001-r003-function-concept
  from_story: story-fourier-heat-representation
  from_step: r001-story-8
  to_story: story-function
  to_step: function-4
  type: thematic_handoff
  perspective: later_interpretation
  assertion_refs:
    - assertion-r001-function-concept
    - assertion-r003-function-historiography
  rationale: >
    R001 deliberately leaves the changing concept of function as a retrospective downstream question.
    R003 supplies a researched nineteenth-century episode that addresses that question without turning the
    relation into a single causal genealogy.

- id: transition-r003-r004-admissibility
  from_story: story-function
  from_step: function-5
  to_story: story-integrability
  to_step: integrability-1
  type: handoff
  perspective: later_interpretation
  assertion_refs:
    - assertion-r003-downstream-admissibility
    - assertion-r004-admissibility-handoff
  rationale: >
    R003 ends with an Atlas-level question about analytic admissibility. R004 explicitly takes that question
    up through Riemann's 1854 investigation. The bridge is editorial and retrospective; it is not attributed
    to Dirichlet as a formulation of Riemann's later criterion.
