- id: r006-u001
  issue: 'Ruffini''s precise contribution and the status of individual impossibility proofs have not been
    checked against a stable primary edition at page level in this packet.

    '
  consequence: 'Ruffini should remain an intermediary with medium certainty rather than being credited
    with an unqualified first complete proof.

    '
- id: r006-u002
  issue: 'The exact contents of Galois''s 1829 and 1830 submissions cannot be identified with the surviving
    1831 memoir simply from chronology.

    '
  consequence: 'Story prose should date the surviving text and the submission history separately and avoid
    claims about what a lost manuscript already contained unless a specialist source establishes it.

    '
- id: r006-u003
  issue: 'Direct reading/transmission evidence among Lagrange, Ruffini, Cauchy, Abel, and Galois is uneven.
    Mathematical continuity of problems does not establish a single personal influence chain.

    '
  consequence: 'Use later_interpretation for the broad genealogy and reserve influenced/motivated for
    separately sourced relations.

    '
- id: r006-u004
  issue: 'Galois''s terminology for groupe, permutation, and substitution does not map one-to-one onto
    modern group/field terminology.

    '
  consequence: 'Modern solvable-group, normal-subgroup, fixed-field, and Galois-correspondence language
    may be used only as explicit modern abstraction or later historiography in this unit.

    '
- id: r006-u005
  issue: 'Immediate reception after Galois''s death is not equivalent to later mathematical uptake; the
    1846 Liouville publication is an important publication event but not a claim that the modern theory
    was understood at once.

    '
  consequence: 'The later reconstruction and dissemination of Galois theory should remain a downstream
    research question rather than being compressed into 1832 or 1846.

    '
