chronology:
- date: 1770–1771
  date_type: academy_volume_publication
  event: 'Lagrange''s Réflexions compares the known solution procedures for lower-degree equations and
    studies how functions of the roots take fewer distinct values than the full set of root permutations
    would allow, using this to explain the degrees of auxiliary resolvent equations.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lagrange-1770-1771
  - src-gray-2018
  - src-kiernan-1971
  primary_locator: Œuvres de Lagrange, t. III, pp. 205–421; especially the cubic/quartic and general permutation
    discussions
  uncertainty: 'Modern subgroup and orbit language can efficiently restate this mathematics, but it is
    not Lagrange''s own conceptual vocabulary.

    '
- date: 1799–1813
  date_type: publication_sequence
  event: 'Ruffini published several attempts to prove the impossibility of a general radical solution
    for equations of degree greater than four and used permutation arguments. Historians treat him as
    an important intermediary, while also distinguishing his work from Abel''s later accepted proof.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-gray-2018
  - src-kiernan-1971
  uncertainty: 'This packet has not yet pinned individual Ruffini claims to a primary-edition page; it
    therefore does not use Ruffini as the sole evidentiary basis for the impossibility theorem.

    '
- date: '1824'
  date_type: publication
  event: 'Abel published a short memoir whose stated theorem is the impossibility of solving the general
    equation of fifth degree algebraically, meaning by the class of radical expressions under discussion.

    '
  perspective: historical
  certainty: high
  sources:
  - src-abel-1824
  - src-gray-2018
  - src-kiernan-1971
  primary_locator: title and pp. 1–8 of the 1824 Christiania pamphlet
  uncertainty: 'The theorem concerns the general quintic. It does not assert that every individual quintic
    equation is unsolvable by radicals.

    '
- date: '1826'
  date_type: publication
  event: 'Abel published a substantially expanded proof in the first volume of Crelle''s Journal, formulated
    for the impossibility of generally solving algebraic equations above the fourth degree by the permitted
    algebraic operations and radicals.

    '
  perspective: historical
  certainty: high
  sources:
  - src-abel-1826
  - src-gray-2018
  - src-kiernan-1971
  primary_locator: Journal für die reine und angewandte Mathematik 1 (1826), pp. 65–84
- date: 1829–1830
  date_type: submission_history
  event: 'Galois presented early work on equations to the Paris Academy through Cauchy in 1829 and submitted
    a revised competition memoir in 1830; the latter did not return through the normal prize process after
    Fourier''s death. The surviving 1831 memoir should not be treated as textually identical to those
    lost or unrecovered submissions.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-kiernan-1971
  - src-ehrhardt-2010
  - src-gray-2018
  uncertainty: 'The exact content and textual continuity of the 1829 and 1830 submissions cannot be reconstructed
    as if the surviving 1831 manuscript were simply the same document.

    '
- date: '1831-01-16'
  date_type: manuscript_date
  event: 'The surviving Mémoire sur les conditions de résolubilité des équations par radicaux is dated
    16 January 1831. Its opening announces a general condition that every equation solvable by radicals
    must satisfy and that conversely guarantees radical solvability; the application developed there is
    explicitly restricted to equations of prime degree.

    '
  perspective: historical
  certainty: high
  sources:
  - src-galois-1846
  - src-ehrhardt-bibnum
  primary_locator: opening paragraph and concluding prime-degree theorem of the memoir
- date: '1831-07-04'
  date_type: referee_report
  event: 'Lacroix and Poisson''s Academy report, dated 4 July 1831, judged the submitted memoir insufficiently
    clear or developed for the Academy to recognize the claimed result and requested a more complete work.
    The report is evidence about reception, not a proof that Galois''s mathematics was false.

    '
  perspective: historical
  certainty: high
  sources:
  - src-poisson-report-1831
  - src-ehrhardt-2010
  primary_locator: Poisson/Lacroix report, 4 July 1831
- date: 1832-05-29 to 1832-05-31
  date_type: final_annotations_and_death
  event: 'Immediately before the duel that led to his death on 31 May 1832, Galois wrote his testamentary
    letter and annotated mathematical manuscripts. These dates are distinct from both the 1831 Academy
    submission and the later publication date.

    '
  perspective: historical
  certainty: high
  sources:
  - src-tannery-1908
  - src-kiernan-1971
  uncertainty: 'Later editions combine documents written at different moments; individual claims should
    therefore be tied to the relevant manuscript or editorial note when possible.

    '
- date: '1846'
  date_type: posthumous_publication
  event: 'Joseph Liouville published Galois''s mathematical papers in volume 11 of the Journal de mathématiques
    pures et appliquées; the solvability memoir appeared on pp. 417–433.

    '
  perspective: historical
  certainty: high
  sources:
  - src-galois-1846
  - src-kiernan-1971
  primary_locator: Journal de mathématiques pures et appliquées 11 (1846), pp. 417–433
  uncertainty: 'Publication in 1846 must not be backdated to 1831 simply because the surviving memoir
    itself carries a 1831 manuscript date.

    '
assertions:
- id: r006-a001
  subject: work-lagrange-reflexions
  predicate: contributed_to
  object: concept-resolvent
  statement: 'Lagrange compared the established cubic and quartic solution methods by expressing auxiliary
    quantities as functions of the roots and examining how many distinct values those functions assume
    when the roots are permuted; this explained why resolvents of lower degree occur in the known formulas.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lagrange-1770-1771
  - src-gray-2018
  uncertainty: 'This is a claim about Lagrange''s equation-solving program, not about an abstract theory
    of permutation groups.

    '
- id: r006-a002
  subject: work-lagrange-reflexions
  predicate: contributed_to
  object: concept-root-permutation
  statement: 'Lagrange made the behavior of expressions under permutations of roots a systematic object
    of calculation in his theory of algebraic equations, but he did not formulate the later abstract group
    concept or organize his argument around abstract group axioms.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-lagrange-1770-1771
  - src-kiernan-1971
  - src-wussing-1984
  - src-gray-2018
- id: r006-a003
  subject: person-ruffini
  predicate: contributed_to
  object: concept-root-permutation
  statement: 'Ruffini''s attempts at an impossibility proof extended the use of permutations in the theory
    of equations and form part of the historical route between Lagrange''s resolvent analysis and Abel''s
    proof, even though the status and reception of Ruffini''s proofs require separate treatment.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-kiernan-1971
  - src-gray-2018
  uncertainty: 'Direct primary-source localization is still missing in this packet; the assertion is therefore
    not a priority claim and should not be used to say that Ruffini had already proved Abel''s theorem
    in an accepted form.

    '
- id: r006-a004
  subject: work-abel-1824
  predicate: contributed_to
  object: concept-solution-by-radicals
  statement: 'Abel''s 1824 memoir establishes the impossibility of a general algebraic solution by radicals
    for the general quintic; its scope is a generic formula problem, not the claim that no particular
    polynomial of degree five can have radical solutions.

    '
  perspective: historical
  certainty: high
  sources:
  - src-abel-1824
  - src-gray-2018
  - src-kiernan-1971
- id: r006-a005
  subject: work-abel-1826
  predicate: generalized
  object: concept-solution-by-radicals
  statement: 'Abel''s 1826 paper gives an expanded impossibility proof for the general algebraic solution
    of equations of degree higher than four, while leaving open the classification of particular higher-degree
    equations that are nevertheless solvable by radicals.

    '
  perspective: historical
  certainty: high
  sources:
  - src-abel-1826
  - src-gray-2018
  - src-kiernan-1971
- id: r006-a006
  subject: work-galois-resolubilite
  predicate: reframed
  object: concept-solution-by-radicals
  statement: 'Galois''s surviving 1831 memoir asks for conditions characterizing when an equation is solvable
    by radicals rather than seeking one universal formula for all equations of a fixed degree; its opening
    explicitly presents the condition as necessary and sufficient, while its worked application in that
    memoir is restricted to prime degree.

    '
  perspective: historical
  certainty: high
  sources:
  - src-galois-1846
  - src-ehrhardt-bibnum
  - src-gray-2018
- id: r006-a007
  subject: work-galois-resolubilite
  predicate: contributed_to
  object: concept-substitution-group
  statement: 'Galois associates an equation with a groupe of permutations of its roots and studies substitutions
    acting on functions of those roots in his solvability argument. These notions are structurally related
    in his work, but his displayed permutation groups, substitutions, and the later abstract group concept
    should remain terminologically distinct rather than being collapsed into one modern object.

    '
  perspective: historical
  certainty: high
  sources:
  - src-galois-1846
  - src-ehrhardt-bibnum
  - src-kiernan-1971
  uncertainty: 'Ehrhardt cautions that Galois''s groupe de permutations and his substitutions should not
    simply be collapsed into one modern group object; later normal-subgroup terminology is a reconstruction.

    '
- id: r006-a008
  subject: work-galois-resolubilite
  predicate: contributed_to
  object: concept-root-permutation
  statement: 'The mathematical relation between an equation and permitted permutations of its roots becomes
    central in Galois''s solvability analysis, but translating this directly into the modern statement
    ''an equation is solvable by radicals iff its Galois group is solvable'' is a later abstraction rather
    than Galois''s own sentence or terminology.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-galois-1846
  - src-ehrhardt-bibnum
  - src-kiernan-1971
  - src-wussing-1984
- id: r006-a009
  subject: person-galois
  predicate: contributed_to
  object: concept-substitution-group
  statement: 'Galois is a major source for the later development of group-theoretic algebra, but the modern
    abstract group concept emerged through subsequent work and multiple mathematical traditions; ''Galois
    invented the modern group'' is therefore too concentrated a priority claim.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-wussing-1984
  - src-kiernan-1971
  - src-gray-2018
- id: r006-a010
  subject: work-galois-resolubilite
  predicate: contributed_to
  object: q-r006-later-abstraction
  statement: 'The posthumous 1846 publication made Galois''s substitution-based treatment available in
    print, but later nineteenth-century work was still needed before groups and fields acquired the independent,
    abstract roles familiar from modern algebra.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kiernan-1971
  - src-wussing-1984
  - src-gray-2018
question_transitions:
- id: r006-qt001
  from_question: q-r006-general-radical-formula
  to_question: q-r006-permutation-structure
  relation: 'Lagrange''s retrospective comparison of successful cubic and quartic formulas made the number
    of values taken by root expressions under permutations a concrete way to explain why lower-degree
    resolvents appear.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lagrange-1770-1771
  - src-gray-2018
- id: r006-qt002
  from_question: q-r006-permutation-structure
  to_question: q-r006-general-impossibility
  relation: 'Later historians can place Ruffini and Abel after Lagrange within a continuing problem about
    general radical formulas and permutation behavior, but chronology alone does not establish a single
    direct transmission chain from Lagrange through Ruffini to Abel.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-kiernan-1971
  - src-gray-2018
  uncertainty: 'The packet has not established a source-by-source reading history sufficient for a stronger
    influenced or motivated relation.

    '
- id: r006-qt003
  from_question: q-r006-general-impossibility
  to_question: q-r006-particular-solvability
  relation: 'Abel''s impossibility theorem rules out a universal radical formula for the general quintic
    while leaving the historically distinct problem of determining which particular equations are solvable;
    Galois''s surviving memoir addresses conditions for that broader solvability question.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-abel-1824
  - src-abel-1826
  - src-galois-1846
  - src-kiernan-1971
  uncertainty: 'This mathematical problem transition is not by itself evidence that Galois was directly
    motivated by reading Abel at the beginning of his own work.

    '
- id: r006-qt004
  from_question: q-r006-particular-solvability
  to_question: q-r006-later-abstraction
  relation: 'Galois''s use of substitution structures in the equation problem became one historical source
    for later group theory, while the abstraction of groups and fields as independent objects belongs
    to a later, multi-source development.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kiernan-1971
  - src-wussing-1984
  - src-gray-2018
