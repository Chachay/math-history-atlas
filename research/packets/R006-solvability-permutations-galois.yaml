research_unit:
  id: R006
  title: Why can some equations be solved by radicals and others cannot? — permutations, solvability,
    and Galois
  period:
    approximate_start: 1770
    approximate_end: 1846
    core_period: 1770–1846
  scope_summary: 'Investigation of the algebraic-equation problem from Lagrange''s comparison of known
    solution methods through Abel''s impossibility theorem and Galois''s conditions for solvability by
    radicals. The packet treats permutations, substitutions, resolvents, and groups in the terminology
    and mathematical roles they had in the period rather than beginning from the modern abstract group
    or field. It distinguishes composition, submission, referee, death, and posthumous-publication dates
    for Galois and treats a clean Lagrange-to-Abel-to-Galois genealogy as a hypothesis to be tested rather
    than a pre-established line of influence.

    '
  research_status: researched
  editorial_status: not_accepted
  generated_date: '2026-08-20'
research_questions:
- id: q001
  question: 'What concrete problem did algebraists mean by solving a general polynomial equation algebraically
    or by radicals in the late eighteenth and early nineteenth centuries?

    '
- id: q002
  question: 'What did Lagrange learn by comparing known formulas and counting the values taken by functions
    of roots under permutations?

    '
- id: q003
  question: 'What exactly did Abel prove about the general quintic, and why does that not mean that every
    particular quintic is unsolvable by radicals?

    '
- id: q004
  question: 'What condition for solvability was Galois trying to formulate, and what role did permutations
    and substitutions play in his argument?

    '
- id: q005
  question: 'How close is Galois''s use of groupe, permutation, and substitution to later abstract group
    theory, and where would modern terminology be anachronistic?

    '
- id: q006
  question: 'What evidence supports direct intellectual transmission among Lagrange, Ruffini, Cauchy,
    Abel, and Galois, and what part of the familiar genealogy is retrospective?

    '
- id: q007
  question: 'Which dates belong to Galois''s surviving work: composition, Academy submission, referee
    report, final annotations, death, and Liouville''s publication?

    '
- id: q008
  question: 'When did permutation groups, groups, and fields become mathematical objects studied in their
    own right rather than tools embedded in the solution of equations?

    '
