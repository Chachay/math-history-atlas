research_unit:
  id: R004
  title: Riemann — trigonometric series, discontinuous functions, and integrability
  period:
    approximate_start: 1829
    approximate_end: 1867
    core_period: 1854–1867
  scope_summary: 'Investigation of Riemann''s Habilitationsschrift on the representability of functions
    by trigonometric series, its explicit engagement with Dirichlet''s unresolved cases, the definite-integral
    criterion introduced as groundwork for that investigation, examples with infinitely many discontinuities,
    and the distinction between the 1854 submission and the posthumous 1867 publication. Earlier Fourier/Dirichlet
    material is inherited context; later measure theory and Lebesgue integration remain out of scope.

    '
  research_status: researched
  editorial_status: not_accepted
  generated_date: '2026-08-20'
research_questions:
- id: q001
  question: What problem was Riemann actually addressing in his trigonometric-series memoir?
- id: q002
  question: Why did the meaning and range of definite integration become necessary within that investigation?
- id: q003
  question: How did Riemann position his work relative to Dirichlet's convergence conditions and unresolved
    cases?
- id: q004
  question: What criterion did Riemann give for the existence of a definite integral in the narrower sense?
- id: q005
  question: What kinds of infinitely discontinuous functions did Riemann explicitly admit as integrable
    examples?
- id: q006
  question: Which date belongs to composition/submission and which to publication of the memoir?
- id: q007
  question: How far is the modern textbook Riemann integral an exact restatement of Riemann's 1854 presentation?
- id: q008
  question: What gap remains between Riemann integrability and general trigonometric representability?
