    '
story_candidates:
- story_id: story-integrability
  title: When is a function integrable enough for trigonometric representation?
  integration_plan: 'Branch from the R003 admissibility question; move to Riemann''s explicit critique
    of the remaining Dirichlet cases, the integral criterion, infinitely discontinuous examples, and the
    remaining gap that integrability alone does not guarantee Fourier-series convergence. Intersect story-function
    at the inherited admissibility/discontinuity nodes rather than extending it as one inevitable line.

    '
