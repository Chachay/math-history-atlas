assertions:
- id: r004-a001
  subject: work-riemann-trig-1854
  predicate: contributed_to
  object: concept-fourier-series
  statement: 'Riemann describes his subject as the representability of arbitrarily given functions by
    trigonometric series and explicitly divides the memoir into a historical part and a new investigation
    covering cases he regarded as still unresolved.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  uncertainty: null
- id: r004-a002
  subject: work-riemann-trig-1854
  predicate: contributed_to
  object: q-fourier-series-convergence
  statement: 'Riemann states that Dirichlet''s treatment had decided representability only under two assumptions:
    that the function admits integration throughout and that it does not have infinitely many maxima and
    minima.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  uncertainty: 'This records Riemann''s own characterization of the prior state of the problem, not a
    modern claim that Dirichlet''s theorem is best formulated exactly this way today.

    '
- id: r004-a003
  subject: work-riemann-trig-1854
  predicate: raised_question
  object: concept-integrability
  statement: 'Immediately after explaining why Dirichlet''s route is insufficient for the unresolved cases,
    Riemann says that uncertainty in fundamental points of definite integration requires him to clarify
    the concept and range of validity of a definite integral.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  uncertainty: null
- id: r004-a004
  subject: person-riemann
  predicate: contributed_to
  object: concept-riemann-integral
  statement: 'In sections 4–5 Riemann defines a definite integral through limiting sums over subdivisions
    with freely chosen sample locations and derives a necessary-and-sufficient oscillation condition for
    convergence of those sums for an everywhere finite function.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  uncertainty: 'The label concept-riemann-integral is an Atlas label. Riemann''s own presentation should
    not be silently replaced by later Darboux-sum or epsilon-delta textbook formulations.

    '
- id: r004-a005
  subject: concept-riemann-integral
  predicate: contributed_to
  object: concept-integrability
  statement: 'Relative to the analytic-admissibility boundary inherited from Dirichlet, Riemann supplies
    a more explicit criterion for when a bounded function''s definite-integral sums converge rather than
    simply assuming that the required integral exists.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-riemann-1867
  - src-rowe-2026
  uncertainty: '''Generalized'' is used comparatively within the Atlas graph and does not claim that every
    earlier integration practice is subsumed by one linear historical progression.

    '
- id: r004-a006
  subject: work-riemann-trig-1854
  predicate: contributed_to
  object: concept-discontinuous-function
  statement: 'Riemann explicitly investigates functions that are discontinuous infinitely often in every
    interval and constructs an example discontinuous at rational arguments which, in lowest terms, have
    an even denominator, while the function still satisfies his criterion for definite integration.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  uncertainty: 'Modern descriptions of these discontinuity points as a dense countable subset of the rationals
    are explanatory abstractions and should not be attributed to Riemann''s terminology.

    '
- id: r004-a007
  subject: work-riemann-trig-1854
  predicate: reframed
  object: concept-discontinuous-function
  statement: 'Compared with the finite-discontinuity hypothesis in Dirichlet''s main stated convergence
    conditions, Riemann''s example admits infinitely many discontinuities while remaining integrable in
    Riemann''s sense; this does not imply that Dirichlet''s entire 1829 admissibility discussion imposed
    finite discontinuity as a universal boundary.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-riemann-1867
  - src-dirichlet-1829
  uncertainty: 'This is a comparison of admissibility conditions, not a claim that Riemann formulated
    a modern topology of discontinuity sets.

    '
- id: r004-a008
  subject: work-riemann-trig-1854
  predicate: contributed_to
  object: q-dirichlet-admissible-functions
  statement: 'Riemann''s 1854 memoir provides a direct historical continuation of the admissibility question
    left open in R003 because he explicitly treats cases that he says Dirichlet had left unresolved and
    makes the definite integral itself part of the investigation.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  - src-dirichlet-1829
  uncertainty: '''Continuation'' here refers to the explicitly discussed research problem, not to an inevitable
    conceptual chain from Dirichlet''s function language to Riemann''s integration theory.

    '
- id: r004-a009
  subject: work-riemann-trig-1854
  predicate: contributed_to
  object: concept-riemann-integral
  statement: 'Specialist historiography interprets the need to enlarge the class of integrable functions
    in the trigonometric-series problem as the original motivation for what is now called the Riemann
    integral.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-rowe-2026
  - src-mascre-2005
  uncertainty: 'This formulation is attributed to later historiography; it is not projected backward as
    Riemann''s own use of the modern name ''Riemann integral''.

    '
- id: r004-a010
  subject: work-riemann-trig-1854
  predicate: raised_question
  object: concept-fourier-series
  statement: 'Riemann explicitly notes that a function can admit integration throughout while its Fourier
    series still fails to converge, so integrability alone does not settle general trigonometric representability.

    '
  perspective: historical
  certainty: high
  sources:
  - src-riemann-1867
  uncertainty: null
question_transitions:
- id: r004-qt001
  from_question: q-dirichlet-admissible-functions
  to_question: q-riemann-integrability
  relation: 'Riemann''s explicit treatment of unresolved Dirichlet cases supplies a historical basis for
    the Atlas transition from analytic admissibility to a more explicit criterion for definite integration.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-riemann-1867
  - src-dirichlet-1829
  note: 'Riemann explicitly names Dirichlet''s unresolved cases and then introduces the integral section;
