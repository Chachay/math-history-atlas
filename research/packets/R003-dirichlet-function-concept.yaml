research_unit:
  id: R003
  title: Dirichlet — trigonometric series, arbitrary functions, and the changing concept of function
  period:
    approximate_start: 1822
    approximate_end: 1837
    core_period: 1829–1837
  scope_summary: 'Investigation of Dirichlet''s 1829 and 1837 work on trigonometric series, the restrictions
    he imposed on functions entering Fourier expansions, his treatment of discontinuity and integrability,
    and the later historiographical claim that this work marks a decisive step toward a modern concept
    of function. Earlier Fourier and Cauchy material is used only where Dirichlet explicitly engages it
    or where specialist historiography is needed to identify the conceptual background. Modern set-theoretic
    function language is treated as retrospective.

    '
  research_status: researched
  editorial_status: not_accepted
  generated_date: '2026-08-20'
research_questions:
- id: q001
  question: What problem was Dirichlet actually addressing in his 1829 convergence paper?
- id: q002
  question: What restrictions did Dirichlet impose on a function before treating its trigonometric expansion
    as meaningful and convergent?
- id: q003
  question: How did Dirichlet discuss arbitrary and discontinuous functions in 1829 and 1837?
- id: q004
  question: What exactly does the 1837 text say that later authors have treated as a definition-like formulation
    of function?
- id: q005
  question: How did Dirichlet's convergence work relate historically to Fourier and Cauchy?
- id: q006
  question: How strong is the textbook claim that Dirichlet gave the first modern definition of function?
- id: q007
  question: What unresolved question remains about which functions are legitimate objects of integration
    and trigonometric representation?
