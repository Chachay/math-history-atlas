chronology:
- date: '1822'
  event: 'Fourier publishes Théorie analytique de la chaleur, including a broad account of function values
    and trigonometric representation that is later part of the background to Dirichlet''s work.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822
  uncertainty: 'This entry establishes background, not a claim that Fourier alone caused a later modern
    concept of function.

    '
- date: '1829'
  event: 'Dirichlet publishes his paper on convergence of trigonometric series for representing an arbitrary
    function between given limits. In the opening he identifies Fourier''s heat work as having introduced
    this mode of representing arbitrary functions, says that no general proof of convergence was then
    known to him, and criticizes Cauchy''s attempted proof.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'Dirichlet refers to Cauchy''s memoir as belonging to the Academy memoirs "for 1823"; R002
    has already established that this nominal volume year must not be confused with the memoir''s 1826
    reading and 1827 publication.

    '
- date: '1829'
  event: 'Dirichlet proves convergence under explicit restrictions, including finite determined values,
    only finitely many discontinuities and extrema on the interval in the main theorem, and a more general
    local condition intended to ensure that the definite integrals used as coefficients retain meaning.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'These hypotheses should not be silently replaced by the later terminology of piecewise
    smoothness, bounded variation, or Riemann integrability.

    '
- date: '1829'
  event: 'Dirichlet gives the rational/irrational two-value example as a function whose values are finite
    and determined everywhere but for which the integrals entering the trigonometric series lose meaning
    under his stated framework.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'Calling this simply the modern "Dirichlet function" is useful retrospectively but should
    not obscure Dirichlet''s immediate point about admissibility for integration and series representation.

    '
- date: '1837'
  event: 'Dirichlet publishes a German treatment of the representation of completely arbitrary functions
    by sine and cosine series in the first volume of Repertorium der Physik. The opening section defines
    a continuous function on an interval through a unique finite y corresponding to each x and explicitly
    says that the dependence need not follow one law throughout the interval or be expressible by mathematical
    operations.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1837
  uncertainty: 'The often-quoted passage is formally a definition of a continuous function, not a fully
    set-theoretic definition of an arbitrary function between arbitrary domains and codomains.

    '
assertions:
- id: r003-a001
  subject: person-dirichlet
  predicate: contributed_to
  object: q-fourier-series-convergence
  statement: 'Dirichlet''s 1829 paper directly addresses the convergence of trigonometric series intended
    to represent arbitrary functions between given limits and provides a rigorous proof under stated restrictions.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'The result is not a proof for every function in the modern unrestricted sense.

    '
- id: r003-a002
  subject: work-dirichlet-1829
  predicate: contributed_to
  object: concept-fourier-series
  statement: 'The 1829 paper analyzes convergence by working with finite partial sums and their limiting
    integral expressions, rather than assuming convergence merely from coefficient decay.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: null
- id: r003-a003
  subject: work-dirichlet-1829
  predicate: reframed
  object: concept-arbitrary-function
  statement: 'In the context of trigonometric representation, Dirichlet separates the idea of a function
    having finite determined values from the stronger conditions needed for the relevant definite integrals
    and convergence argument to make sense.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: '"Separates" here describes the distinction made in the paper; it does not assert a modern
    domain/codomain ontology.

    '
- id: r003-a004
  subject: work-dirichlet-1829
  predicate: contributed_to
  object: concept-discontinuous-function
  statement: 'Dirichlet''s convergence theorem explicitly allows a finite number of discontinuities and
    states that at a discontinuity the trigonometric series converges to a value determined by the two
    neighboring limiting values.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'Modern notation for one-sided limits is explanatory shorthand and is not attributed to
    Dirichlet.

    '
- id: r003-a005
  subject: work-dirichlet-1829
  predicate: raised_question
  object: concept-integrability
  statement: 'Dirichlet''s rational/irrational example shows that finite determined values alone did not
    make a function admissible for his Fourier-integral machinery; the meaning of the definite integral
    was itself a boundary on admissibility.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'The packet deliberately does not identify Dirichlet''s condition with the later Riemann
    criterion.

    '
- id: r003-a006
  subject: person-dirichlet
  predicate: contributed_to
  object: concept-function
  statement: 'Dirichlet''s 1837 formulation allows a continuous function on an interval to depend on x
    without one common law throughout the interval and without dependence expressible by mathematical
    operations.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1837
  uncertainty: 'This is a statement about the wording of Dirichlet''s continuous-function definition,
    not yet a claim that he stated the twentieth-century set-theoretic definition of function.

    '
- id: r003-a007
  subject: concept-fourier-series
  predicate: contributed_to
  object: q-what-is-function
  statement: 'Specialist historiography treats the Fourier/Dirichlet work on representing broad classes
    of numerical data as an important episode in loosening the association of functions with a single
    analytic expression.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-youschkevitch-1976
  - src-kjeldsen-lutzen-2015
  uncertainty: 'This is a retrospective historical synthesis, not evidence that Fourier or Dirichlet described
    their aim as creating the modern concept of function.

    '
- id: r003-a008
  subject: person-dirichlet
  predicate: contributed_to
  object: q-what-is-function
  statement: 'Dirichlet''s 1837 text is a major nineteenth-century formulation in the history of the function
    concept, but the label "first modern definition of function" is too compressed to use as an unqualified
    historical fact.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-youschkevitch-1976
  uncertainty: 'Earlier Fourier and Euler formulations and the nearby independent work of Lobachevsky
    complicate a single-person priority claim; moreover, the famous Dirichlet passage directly defines
    continuity on a real interval rather than arbitrary set mappings.

    '
- id: r003-a009
  subject: person-dirichlet
  predicate: contributed_to
  object: concept-fourier-series
  statement: 'Dirichlet''s 1829 paper explicitly places his proof after Fourier''s representational work
    and in criticism of Cauchy''s attempted convergence proof, giving direct textual evidence for this
    local historical relation.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: 'This does not establish that Fourier''s heat problem was the sole motivation for Dirichlet''s
    wider mathematical work.

    '
- id: r003-a010
  subject: concept-discontinuous-function
  predicate: contributed_to
  object: q-what-is-function
  statement: 'The use of functions with jumps and the rational/irrational example made it possible to
    discuss numerical dependencies whose behavior could not be captured by one ordinary analytic expression,
    contributing to later changes in how historians describe the nineteenth-century function concept.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-dirichlet-1829
  - src-youschkevitch-1976
  uncertainty: 'A stronger causal claim that discontinuous examples themselves "created" the modern definition
    is not established.

    '
- id: r003-a011
  subject: work-dirichlet-1837
  predicate: contributed_to
  object: q-dirichlet-admissible-functions
  statement: 'Read retrospectively, Dirichlet''s 1837 treatment helps expose the downstream problem of
    identifying conditions under which broadly specified functions can legitimately enter definite integrals
    and trigonometric representations.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-dirichlet-1837
  - src-youschkevitch-1976
  uncertainty: 'This question is phrased for the Atlas as a bridge toward later integration theory; it
    is not asserted as Dirichlet''s own wording.

    '
