  canonical_name: Curvature of a surface
- id: concept-surface-applicability
  type: Concept
  canonical_name: Applicability and isometric development of surfaces
  terminology_note: '"Isometry" is convenient modern terminology. Gauss''s own 1827 discussion is phrased
    in terms of one surface being developed upon another and equality of corresponding infinitesimal elements.

    '
- id: concept-intrinsic-surface-geometry
  type: Concept
  canonical_name: Geometry determined within a surface
  terminology_note: 'Reader-facing concept label. Do not attribute the modern term "intrinsic geometry"
    to Gauss without qualification.

    '
- id: result-theorema-egregium
  type: Result
  canonical_name: Theorema Egregium
- id: work-gauss-disquisitiones-surfaces
  type: Work
  canonical_name: General Investigations of Curved Surfaces
  original_title: Disquisitiones generales circa superficies curvas
  presentation_date: '1827-10-08'
  volume_year: 1828
chronology:
- date: 1760–1767
  date_type: publication_sequence
  event: 'Euler developed a theory of normal curvature of surfaces and related the curvature of normal
    sections to principal curvatures. This work belongs to the pre-Gaussian theory of surface curvature
    and prevents treating the subject as beginning with Gauss.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kline-1990
  - src-euler-dsb
  uncertainty: 'This packet uses specialist historical synthesis rather than a page-localized edition
    of Euler''s original surface-curvature memoirs.

    '
- date: '1795'
  date_type: publication
  event: 'Monge''s treatise organized substantial earlier work on surfaces and extended an analytic tradition
    that Gauss inherited rather than replaced ex nihilo.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kline-1990
  - src-eom-differential-geometry
- date: circa 1816
  date_type: manuscript_or_research_note
  event: 'Dombrowski identifies unpublished Gauss material from around 1816 in which invariance of the
    spherical-image area under bending without stretching already appears; he treats this as an early
    precursor of the later pointwise invariance theorem.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-dombrowski-1979
  uncertainty: 'The date and interpretation depend on Dombrowski''s reconstruction from Gauss''s Werke;
    this should not be narrated as a public 1816 theorem.

    '
- date: 1822–1825
  date_type: manuscript_development
  event: 'According to Dombrowski''s reconstruction, Gauss obtained formulas expressing curvature from
    metric data in special coordinate systems before the 1827 published memoir, including conformal coordinates
    in 1822 and geodesic polar coordinates in 1825.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-dombrowski-1979
- date: '1827-10-08'
  date_type: presentation
  event: 'Gauss presented the Disquisitiones generales circa superficies curvas to the Royal Society of
    Göttingen. The published memoir defines a pointwise measure of curvature as the ratio of the infinitesimal
    area of the spherical image to the corresponding infinitesimal area on the surface and derives formulas
    in general surface coordinates.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  primary_locator: §§6–10; presentation date on title page
- date: '1827'
  date_type: theorem_in_presented_memoir
  event: 'Gauss states the remarkable theorem that when a curved surface is developed upon another surface,
    the measure of curvature at corresponding points remains unchanged. The proof follows from his expression
    of curvature using the coefficients E, F, G of the infinitesimal line element and their derivatives.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  - src-dombrowski-1979
  primary_locator: §12, theorem following the formula for curvature
- date: '1827'
  date_type: contemporary_summary
  event: 'In Gauss''s own abstract of the work, he explicitly distinguishes relations that depend on the
    surface''s form in space from relations independent of the forms a flexible but inextensible surface
    may assume, and assigns the measure of curvature and geodesic constructions to the latter class.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  primary_locator: Abstract of the paper of 1827, concluding discussion
- date: '1854'
  date_type: lecture
  event: 'Riemann''s habilitation lecture generalized questions of metric and curvature beyond two-dimensional
    surfaces. Modern historical accounts connect this program to Gauss''s surface theory, but this unit
    does not attempt to establish a complete Gauss-to-Riemann transmission chain.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-darrigol-2021
  - src-kline-1990
  uncertainty: 'The mathematical generalization is clear; the detailed historical channels and intermediaries
    are outside R007 and should not be compressed into a single causal edge.

    '
assertions:
- id: r007-a001
  subject: person-euler
  predicate: contributed_to
  object: concept-surface-curvature
  statement: 'Euler made major pre-Gaussian advances in the curvature of surfaces, including the relation
    between normal-section curvature and principal curvatures.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kline-1990
  - src-euler-dsb
- id: r007-a002
  subject: person-monge
  predicate: contributed_to
  object: concept-surface-curvature
  statement: 'Monge extended and systematized the analytic theory of surfaces before Gauss, so the development
    of differential geometry of surfaces should not be narrated as a single- inventor episode.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kline-1990
  - src-eom-differential-geometry
- id: r007-a003
  subject: work-gauss-disquisitiones-surfaces
  predicate: contributed_to
  object: concept-surface-curvature
  statement: 'In the 1827 memoir Gauss defines a pointwise measure of curvature through the spherical
    image of the surface and develops formulas for it in general surface coordinates.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  source_locator: §§6–10
- id: r007-a004
  subject: work-gauss-disquisitiones-surfaces
  predicate: contributed_to
  object: concept-surface-applicability
  statement: 'Gauss treats development of one surface upon another through preservation of the infinitesimal
    line element, represented by equal coefficients E, F, and G for corresponding elements.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  source_locator: §12
- id: r007-a005
  subject: result-theorema-egregium
  predicate: contributed_to
  object: concept-surface-applicability
  statement: 'Gauss''s theorem states that if one curved surface is developed upon another, the measure
    of curvature at corresponding points remains unchanged.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  - src-dombrowski-1979
  source_locator: Gauss §12; Dombrowski discussion of Theorema Egregium
- id: r007-a006
  subject: work-gauss-disquisitiones-surfaces
  predicate: contributed_to
  object: concept-intrinsic-surface-geometry
  statement: 'Gauss''s abstract distinguishes properties dependent on a surface''s spatial form from properties
    unchanged when the surface is flexed without extension; he includes curvature, figures on the surface,
    angles, areas, and shortest lines among the latter.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  source_locator: Abstract of the paper of 1827, final paragraphs
  uncertainty: 'The assertion deliberately describes Gauss''s distinction without claiming that he used
    the later technical vocabulary "intrinsic" and "extrinsic".

    '
- id: r007-a007
  subject: result-theorema-egregium
  predicate: contributed_to
  object: concept-intrinsic-surface-geometry
  statement: 'In modern mathematical language, the Theorema Egregium is read as showing that Gaussian
    curvature is determined by the metric of the surface and is invariant under local isometries.

    '
  perspective: modern_abstraction
  certainty: high
  sources:
  - src-dombrowski-1979
  - src-darrigol-2021
- id: r007-a008
  subject: work-gauss-disquisitiones-surfaces
  predicate: contributed_to
  object: concept-intrinsic-surface-geometry
  statement: 'Later histories of differential geometry interpret Gauss''s 1827 work as foundational for
    intrinsic surface geometry, while Gauss''s own text formulates the distinction in terms of development,
    infinitesimal metric relations, and properties independent of a surface''s changing spatial form rather
    than the later technical vocabulary.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-dombrowski-1979
  - src-kline-1990
- id: r007-a009
  subject: person-gauss
  predicate: contributed_to
  object: concept-surface-applicability
  statement: 'Gauss''s geodetic and mapmaking work formed part of the practical and mathematical context
    in which his investigations of surface mappings and surface geometry developed.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-kline-1990
  - src-dombrowski-1979
  uncertainty: 'The sources support contextual linkage more safely than a strong claim that surveying
    directly caused the Theorema Egregium.

    '
- id: r007-a010
  subject: result-theorema-egregium
  predicate: contributed_to
  object: concept-intrinsic-surface-geometry
  statement: 'The historical significance of the theorem is not that Gauss abandoned the embedding of
    surfaces in Euclidean three-space; rather, a calculation formulated within an embedded surface theory
    revealed quantities independent of the particular embedding under metric-preserving development.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-gauss-1827-1902
  - src-dombrowski-1979
- id: r007-a011
  subject: work-gauss-disquisitiones-surfaces
  predicate: contributed_to
  object: result-theorema-egregium
  statement: 'The 1827 memoir supplies a general-coordinate derivation of the curvature formula from E,
    F, G and their derivatives and immediately draws the invariance theorem for developed surfaces.

    '
  perspective: historical
  certainty: high
  sources:
  - src-gauss-1827-1902
  source_locator: §§11–12
- id: r007-a012
  subject: person-gauss
  predicate: contributed_to
  object: concept-intrinsic-surface-geometry
  statement: 'Dombrowski''s reconstruction places important unpublished precursors to Gauss''s later invariance
    result in work from roughly 1816 onward, showing that the 1827 theorem emerged from a longer research
    development rather than a single isolated calculation.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-dombrowski-1979
  uncertainty: 'This chronology is reconstructed from unpublished notes and should not be presented as
    a sequence of publicly established results.

    '
question_transitions:
- id: r007-qt001
  from_question: q001
  to_question: q002
  relation: reframed
  statement: 'Earlier theories of surface curvature supplied the mathematical background against which
    Gauss reformulated curvature using the spherical image and general surface coordinates.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-kline-1990
  - src-dombrowski-1979
- id: r007-qt002
  from_question: q002
  to_question: q003
  relation: raised_question
  statement: 'Gauss''s applicability problem and his expression of curvature through the infinitesimal
    metric meet in the Theorema Egregium: equal metric coefficients for corresponding surface elements
    imply equal measure of curvature.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-gauss-1827-1902
  - src-dombrowski-1979
- id: r007-qt003
  from_question: q003
  to_question: q005
  relation: reframed
  statement: 'Gauss''s invariance theorem and his own distinction between spatial-form-dependent and deformation-independent
    relations are the historical basis for the later language of an intrinsic geometry of a surface.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-gauss-1827-1902
  - src-dombrowski-1979
- id: r007-qt004
  from_question: q005
  to_question: q007
  relation: later_connection
  statement: 'Riemann''s later generalization of metric and curvature to higher dimensions can be read
    as extending the line of questions opened by Gauss''s surface theory, but R007 does not claim a complete
    direct causal genealogy.

    '
  perspective: later_interpretation
  certainty: medium
  sources:
  - src-darrigol-2021
  - src-kline-1990
