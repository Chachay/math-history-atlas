research_unit:
  id: R007
  title: Gauss — curvature, surfaces, and the emergence of intrinsic geometry
  period:
    approximate_start: 1760
    approximate_end: 1854
    core_period: 1760–1828
  scope_summary: 'Investigation of the geometry of curved surfaces from Euler and Monge through Gauss''s
    Disquisitiones generales circa superficies curvas, with the Atlas spine focused on what properties
    of a surface can be determined from measurements internal to the surface. Geodesy and mapmaking are
    retained as historical context, but not promoted into the mathematical Question layer. Later language
    of intrinsic geometry is distinguished from Gauss''s own language of development/applicability, infinitesimal
    line elements, and measure of curvature.

    '
  origin_pattern: mixed
  research_status: researched
  editorial_status: not_accepted
  generated_date: '2026-08-20'
research_questions:
- id: q001
  question: 'How were curvature and developable surfaces treated before Gauss, especially by Euler and
    Monge?

    '
- id: q002
  question: 'How did Gauss define the measure of curvature of a surface, and how does that definition
    relate to the later product-of-principal-curvatures formulation?

    '
- id: q003
  question: 'What exactly does the theorem later called the Theorema Egregium state in Gauss''s 1827 memoir?

    '
- id: q004
  question: 'Which surface quantities did Gauss show to depend only on the metric coefficients of the
    infinitesimal line element rather than on the particular embedding in Euclidean space?

    '
- id: q005
  question: 'To what extent is the modern intrinsic/extrinsic distinction present in Gauss''s own words,
    and to what extent is it a later conceptual organization?

    '
- id: q006
  question: 'What evidence supports connecting Gauss''s geodetic work to his surface theory, and how strong
    may that motivational claim responsibly be?

    '
- id: q007
  question: 'What later path from Gauss toward Riemannian geometry is historically supportable without
    turning mathematical generalization into a simple direct genealogy?

    '
