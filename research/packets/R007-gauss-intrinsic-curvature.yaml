story_candidates:
- id: r007-story-candidate-001
  title: Can geometry be read from inside a surface?
  arc: 'earlier surface curvature → Gauss''s measure of curvature → development of surfaces → Theorema
    Egregium → deformation-independent surface geometry → open path toward later higher-dimensional geometry

    '
  caution: 'Do not write the story as "surveying caused intrinsic geometry" or "Gauss invented differential
    geometry." Do not use Riemann as a direct continuation unless a separately supported transition is
    available.

    '
