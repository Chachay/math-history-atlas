uncertainties:
- id: r007-u001
  issue: 'The exact strength of the causal link from Gauss''s Hanover geodesy to the Theorema Egregium
    remains weaker than the mathematical and chronological connection.

    '
  impact: 'Story prose should say geodesy supplied practical context or was associated with the development
    unless stronger documentary evidence is added.

    '
- id: r007-u002
  issue: '"Intrinsic geometry" is later organizing vocabulary. Gauss''s own abstract contains a strikingly
    close conceptual distinction, but the modern technical label should remain marked as later interpretation.

    '
  impact: 'Canonical historical assertions should quote or paraphrase Gauss''s own deformation-based distinction
    rather than attribute the word "intrinsic" to him.

    '
- id: r007-u003
  issue: 'Dombrowski reconstructs important unpublished developments around 1816, 1822, and 1825 from
    Gauss''s papers and Werke. Those dates are not publication dates.

    '
  impact: 'Preserve date type and avoid presenting the public 1827 theorem as already published in the
    earlier years.

    '
- id: r007-u004
  issue: 'A responsible Gauss-to-Riemann transition needs more than the fact that Riemann later generalized
    metric and curvature. The detailed transmission/intermediary question is not resolved in this bounded
    unit.

    '
  impact: 'Keep the Riemann connection as a later branch/open path rather than a direct causal Story edge.

    '
