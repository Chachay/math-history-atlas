chronology:
- date: 1740s–1760s
  event: 'The vibrating-string controversy among d''Alembert, Euler, Daniel Bernoulli, Lagrange and others
    raises questions about arbitrary curves/functions and whether general motions can be expressed through
    trigonometric modes.

    '
  perspective: historical
  certainty: high
  sources:
  - src-herreman-2013
  - src-riemann-trig-translation
  uncertainty: 'The exact relationship between eighteenth-century formulations and the later Fourier theorem
    should not be expressed using modern equivalence without qualification.

    '
- date: '1807-12-21'
  event: 'Fourier presents his memoir on heat propagation to the Institut de France.

    '
  perspective: historical
  certainty: high
  sources:
  - src-grattan-guinness-ravetz-1972
  - src-mactutor-fourier
  uncertainty: null
- date: 1808–1809
  event: 'Fourier responds to concerns about his trigonometric representations and their convergence and
    representational scope.

    '
  perspective: historical
  certainty: medium_high
  sources:
  - src-grattan-guinness-ravetz-1972
  - src-mactutor-fourier
  uncertainty: 'Detailed reconstruction of the correspondence and individual positions requires consultation
    of the critical edition and manuscript record.

    '
- date: '1811'
  event: 'Fourier submits an expanded heat memoir for the Institut''s prize competition. The work wins
    the prize, although the report retains reservations concerning rigor and generality.

    '
  perspective: historical
  certainty: high
  sources:
  - src-grattan-guinness-ravetz-1972
  - src-mactutor-fourier
  uncertainty: null
- date: '1822'
  event: 'Fourier publishes Théorie analytique de la chaleur, including systematic treatments of trigonometric
    expansions and the representation of arbitrary temperature distributions.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-ch3
  - src-fourier-1822-art235
  - src-smithsonian-fourier
  uncertainty: null
- volume_year: 1823
  read_date: '1826-02-27'
  publication_year: 1827
  event: Cauchy presents and later publishes an attempted general treatment of convergence of periodic/trigonometric
    series; Dirichlet later argues that the proof is insufficient.
  perspective: historical
  certainty: high
  sources:
  - src-cauchy-periodic-series-1827
  - src-dirichlet-1829
  uncertainty: The memoir appears in volume 6 nominally labeled for the year 1823, but the memoir itself
    was read on 27 February 1826 and the volume was published in 1827. These date types must not be conflated.
- date: '1829'
  event: 'Dirichlet gives the first generally recognized rigorous convergence theorem for Fourier series
    under explicit restrictions on the represented function.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  - src-encyclopedia-fourier-series
  uncertainty: '"First rigorous proof" should be understood as the standard historical characterization
    of a general convergence theorem, not as a claim that no earlier special cases had been rigorously
    established.

    '
- date: 1854 / 1867
  event: 'Riemann''s work on trigonometric series takes the subject considerably beyond Fourier and Dirichlet,
    linking it to deeper questions about integration, representation and general trigonometric series.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-riemann-trig-translation
  - src-riemann-landmark
  uncertainty: 'Riemann belongs outside the core 1790–1830 research period and should appear as downstream
    reception rather than as part of Fourier''s contemporary program.

    '
assertions:
- id: r001-a001
  subject: person-fourier
  predicate: investigated
  object: problem-heat-propagation
  statement: 'Fourier''s central scientific problem was to determine mathematically how temperature is
    distributed and changes through solid bodies.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-ch3
  - src-fourier-1822-ch9
  - src-grattan-guinness-ravetz-1972
  uncertainty: null
- id: r001-a002
  subject: person-fourier
  predicate: reduced_physical_problem_to
  object: problem-heat-boundary-value
  statement: 'Fourier treated heat propagation by deriving differential equations for temperature and
    then solving them subject to physical information about initial temperatures, geometry and boundary
    interaction.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-ch3
  - src-fourier-1822-ch8
  - src-grattan-guinness-ravetz-1972
  uncertainty: 'Modern terminology such as "initial-value problem" and "boundary-value problem" is useful
    descriptively but was not Fourier''s later formal PDE vocabulary.

    '
- id: r001-a003
  subject: work-fourier-1807
  predicate: already_contained
  object: concept-trigonometric-series
  statement: 'The essential use of trigonometric series was already present in Fourier''s 1807 memoir
    rather than being invented only for the 1822 book.

    '
  perspective: historical
  certainty: high
  sources:
  - src-grattan-guinness-ravetz-1972
  - src-smithsonian-fourier
  uncertainty: null
- id: r001-a004
  subject: concept-trigonometric-series
  predicate: entered_as_method_for
  object: problem-heat-boundary-value
  statement: 'Trigonometric series entered Fourier''s heat theory because separated solutions of the heat
    equations supplied sinusoidal spatial modes, while the physical problem required matching prescribed
    boundary or initial temperature distributions by combinations of those modes.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-section207
  - src-fourier-1822-art235
  - src-wiener-historical-background
  uncertainty: '"Modes" and especially "eigenmodes" are modern explanatory vocabulary. They accurately
    summarize the mathematical structure but should not be presented as Fourier''s own terminology.

    '
- id: r001-a005
  subject: work-fourier-1822
  predicate: explicitly_states_necessity_of
  object: concept-trigonometric-series
  statement: 'Fourier explicitly says that the fundamental heat problems cannot be solved completely without
    reducing the functions describing the initial state of temperature to trigonometric-series form.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-art235
  uncertainty: null
- id: r001-a006
  subject: person-fourier
  predicate: derived
  object: concept-fourier-coefficients
  statement: 'Fourier supplied definite-integral formulas for the coefficients that associate a given
    function with its sine and/or cosine expansion.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-art219-221
  - src-fourier-1822-art235
  uncertainty: 'Some related coefficient techniques had antecedents in eighteenth-century work, and Laplace
    also used closely related integral representations. Priority should therefore be stated specifically
    rather than as invention ex nihilo.

    '
- id: r001-a007
  subject: person-fourier
  predicate: claimed_representation_of
  object: concept-arbitrary-function
  statement: 'Fourier asserted that a function specified arbitrarily over a finite interval, including
    one represented by the ordinate of an arbitrarily drawn curve, could be developed into trigonometric
    series.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-art235
  - src-fourier-1822-discontinuous
  uncertainty: 'Fourier''s word "arbitrary" must not automatically be identified with the unrestricted
    modern set-theoretic notion of an arbitrary real-valued function.

    '
- id: r001-a008
  subject: person-fourier
  predicate: included
  object: concept-discontinuous-function
  statement: 'Fourier explicitly allowed functions whose ordinates were not constrained by one common
    analytic law and stated that his representation methods applied to discontinuous functions.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-function-conception
  - src-fourier-1822-discontinuous
  uncertainty: 'Fourier''s examples and arguments do not establish the modern assertion that every conceivable
    discontinuous function possesses a pointwise convergent Fourier series equal to that function.

    '
- id: r001-a009
  subject: person-fourier
  predicate: claimed
  object: concept-convergence
  statement: 'Fourier stated in 1822 that trigonometric series ordered in multiples of sine or cosine
    are always convergent and converge toward the value of the developed function.

    '
  perspective: historical
  certainty: high
  sources:
  - src-fourier-1822-convergence-claim
  uncertainty: 'Taken literally at modern generality, this statement is false. It records Fourier''s historical
    claim, not a theorem accepted without qualification today.

    '
- id: r001-a010
  subject: person-lagrange
  predicate: objected_to
  object: concept-trigonometric-series
  statement: 'Lagrange was among the principal contemporary critics of Fourier''s broad use of trigonometric
    representations, against the background of his earlier position in the vibrating-string controversy.

    '
  perspective: historical
  certainty: high
  sources:
  - src-mactutor-fourier
  - src-grattan-guinness-ravetz-1972
  - src-herreman-2013
  uncertainty: 'The precise division of objections among Lagrange, Laplace and other committee members
    varies in secondary reconstructions; detailed personal attribution should use the surviving committee
    and correspondence record.

    '
- id: r001-a011
  subject: person-laplace
  predicate: raised_concerns_about
  object: work-fourier-1807
  statement: 'Laplace participated in the examination of Fourier''s 1807 work and was associated with
    early concerns about Fourier''s treatment, although his attitude was not simply one of permanent rejection.

    '
  perspective: historical
  certainty: medium_high
  sources:
  - src-mactutor-fourier
  - src-grattan-guinness-ravetz-1972
  uncertainty: 'Avoid reducing the episode to "Laplace rejected Fourier." His later reactions were more
    favorable than Lagrange''s according to historical reconstructions.

    '
- id: r001-a012
  subject: person-biot
  predicate: disputed
  object: problem-heat-propagation
  statement: 'Contemporary controversy concerned not only Fourier''s series but also the physical derivation
    and priority of the mathematical theory of heat, with Biot among those contesting Fourier.

    '
  perspective: historical
  certainty: high
  sources:
  - src-mactutor-fourier
  - src-grattan-guinness-ravetz-1972
  uncertainty: 'Priority disputes and mathematical objections should be distinguished; they were overlapping
    but not identical issues.

    '
- id: r001-a013
  subject: work-fourier-1811
  predicate: received_criticism_for
  object: rigor and generality
  statement: 'Fourier won the heat prize with his revised memoir, but the judges did not regard the work
    as fully satisfactory in rigor and generality.

    '
  perspective: historical
  certainty: high
  sources:
  - src-mactutor-fourier
  - src-grattan-guinness-ravetz-1972
  uncertainty: null
- id: r001-a014
  subject: concept-arbitrary-function
  predicate: had_pre_fourier_history_in
  object: problem-vibrating-string
  statement: 'Questions about arbitrary functions and trigonometric representation did not originate with
    Fourier. They had already appeared in the eighteenth- century vibrating-string controversy.

    '
  perspective: historical
  certainty: high
  sources:
  - src-herreman-2013
  - src-riemann-trig-translation
  uncertainty: null
- id: r001-a015
  subject: person-daniel-bernoulli
  predicate: advocated
  object: concept-trigonometric-series
  statement: 'Daniel Bernoulli had argued that vibrating motions could be formed from harmonic components,
    anticipating part of the physical intuition later associated with trigonometric decomposition.

    '
  perspective: historical
  certainty: high
  sources:
  - src-herreman-2013
  - src-ohm-history
  - src-riemann-trig-translation
  uncertainty: 'Bernoulli did not possess Fourier''s later integral coefficient formula or Fourier''s
    exact framework of arbitrary-function representation, so calling his claim "the Fourier theorem" would
    be anachronistic.

    '
- id: r001-a016
  subject: person-fourier
  predicate: transformed_status_of
  object: concept-trigonometric-series
  statement: 'Fourier''s distinctive contribution was not the first appearance of sines and cosines, but
    their systematic use with coefficient formulas to represent general prescribed data in a broad physical-mathematical
    theory.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-herreman-2013
  - src-grattan-guinness-ravetz-1972
  - src-wiener-historical-background
  uncertainty: 'Historians differ over how strongly to characterize Fourier''s originality relative to
    Euler, Bernoulli, Lagrange and Laplace.

    '
- id: r001-a017
  subject: person-cauchy
  predicate: attempted_to_establish
  object: concept-convergence
  statement: 'Cauchy attempted to prove convergence results for trigonometric series before Dirichlet''s
    1829 paper.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: null
- id: r001-a018
  subject: person-dirichlet
  predicate: criticized
  object: person-cauchy
  statement: 'Dirichlet explicitly argued that Cauchy''s convergence proof was insufficient, including
    because it appealed to complex substitutions for functions that need not be given by analytic formulas
    and because its asymptotic argument did not imply convergence.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  uncertainty: null
- id: r001-a019
  subject: person-dirichlet
  predicate: established_conditions_for
  object: concept-convergence
  statement: 'Dirichlet''s 1829 theorem established convergence under restrictions such as finitely many
    extrema and finitely many ordinary discontinuities; at a jump the Fourier series converges to the
    mean of the two limiting values rather than arbitrarily reproducing the assigned point value.

    '
  perspective: historical
  certainty: high
  sources:
  - src-dirichlet-1829
  - src-encyclopedia-fourier-series
  uncertainty: 'Modern textbook formulations often use bounded variation or piecewise smoothness and should
    not be projected verbatim onto Dirichlet''s original formulation.

    '
- id: r001-a020
  subject: concept-convergence
  predicate: became_independent_problem_after
  object: work-fourier-1822
  statement: 'Fourier''s representation program made convergence of trigonometric series a major problem
    in analysis that could no longer be settled merely by formal manipulation of infinite series.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-dirichlet-1829
  - src-riemann-trig-translation
  - src-encyclopedia-trig-series
  uncertainty: 'This is a historical synthesis. Convergence theory also developed through other series
    problems, so Fourier should not be treated as its sole cause.

    '
- id: r001-a021
  subject: concept-arbitrary-function
  predicate: was_broadened_in_context_of
  object: concept-trigonometric-series
  statement: 'Fourier''s treatment strongly contributed to nineteenth-century pressure to distinguish
    a function from a single analytic formula describing it.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-fourier-1822-function-conception
  - src-riemann-trig-translation
  - src-poincare-value-science
  uncertainty: 'The modern function concept resulted from a long development involving Euler, the vibrating-string
    controversy, Dirichlet, Riemann and others. A direct statement that "Fourier invented the modern concept
    of function" is not supported.

    '
- id: r001-a022
  subject: person-riemann
  predicate: later_extended_analysis_of
  object: concept-trigonometric-series
  statement: 'Riemann later treated the representation problem and general trigonometric series in ways
    that forced deeper examination of integration, convergence and exceptional sets.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-riemann-trig-translation
  - src-riemann-landmark
  uncertainty: 'Riemann''s work occurred decades after Fourier and should not be inserted into the contemporary
    reception of the 1807 or 1822 work.

    '
- id: r001-a023
  subject: person-fourier
  predicate: did_not_use_modern_concept_of
  object: frequency-domain signal decomposition
  statement: 'Describing Fourier''s heat work as a decomposition into "frequencies" is a useful modern
    analogy but risks anachronism. In the heat problems the sine and cosine terms primarily function as
    spatial harmonics or separated spatial modes whose amplitudes decay with time.

    '
  perspective: modern_abstraction
  certainty: high
  sources:
  - src-fourier-1822-ch3
  - src-fourier-1822-art235
  uncertainty: 'Harmonic and vibration language existed before and during Fourier''s time, but the modern
    signal-processing ontology of time domain versus frequency domain is later.

    '
- id: r001-a024
  subject: concept-separation-modes
  predicate: has_modern_interpretation_as
  object: eigenfunction expansion
  statement: 'Modern mathematics interprets Fourier''s method as expansion in eigenfunctions of the spatial
    differential operator determined by the geometry and boundary conditions.

    '
  perspective: modern_abstraction
  certainty: high
  sources:
  - src-fourier-1822-ch3
  - src-grattan-guinness-ravetz-1972
  uncertainty: 'Eigenvalue/eigenfunction terminology belongs to later spectral theory and must not be
    attributed directly to Fourier.

    '
- id: r001-a025
  subject: problem-heat-propagation
  predicate: historically_generated_questions_about
  object: concept-arbitrary-function
  statement: 'The demand to allow essentially arbitrary initial temperature distributions gave concrete
    physical force to questions about what sorts of functions could legitimately be represented and manipulated
    analytically.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-fourier-1822-art235
  - src-fourier-1822-function-conception
  - src-poincare-value-science
  uncertainty: 'This causal formulation should be read as a contribution to the history of the function
    concept, not as an exclusive origin story.

    '
- id: r001-a026
  subject: Fourier-to-Cauchy-to-Riemann narrative
  predicate: is
  object: historically incomplete
  statement: 'A simple Fourier → Cauchy → Riemann sequence suppresses important actors and distinct problem
    traditions. At minimum the eighteenth-century vibrating-string controversy, Lagrange and Laplace''s
    reception, Cauchy''s unsuccessful convergence attempt, Dirichlet''s 1829 theorem, and later Riemannian
    developments must be distinguished.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-herreman-2013
  - src-dirichlet-1829
  - src-riemann-trig-translation
  - src-grattan-guinness-ravetz-1972
  uncertainty: 'Even this expanded chain is selective; a comprehensive nineteenth-century genealogy would
    also involve Poisson, Abel, Seidel, Jordan, Cantor, Weierstrass, Lebesgue and others depending on
    the endpoint being studied.

    '
question_transitions:
