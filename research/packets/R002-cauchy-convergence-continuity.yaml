uncertainties:
  - id: r002-u001
    issue: >
      Cauchy's infinitesimals and continuity definitions are subject to active historiographical
      debate. This packet records textual formulations but does not settle whether they should
      be reconstructed within a strictly Archimedean or non-Archimedean framework.
  - id: r002-u002
    issue: >
      The exact relation between Abel's 1826 remark and Cauchy's later 1853 revision should not
      be expressed as direct influence without documentary evidence that Cauchy read and acted
      on Abel's criticism.
  - id: r002-u003
    issue: >
      The line Cauchy → Seidel/Stokes → Weierstrass is not necessarily a direct transmission chain.
      Modern scholarship identifies partially independent developments.
  - id: r002-u004
    issue: >
      The packet deliberately separates Cauchy's broad program of rigor from the Fourier-series
      intersection. More evidence would be required to claim that Fourier's work historically
      motivated Cauchy's foundational definitions of limit or continuity.
  - id: r002-u005
    issue: >
      The Abel primary-source URL is bibliographically identified but should be replaced by a
      direct persistent scan URL before canonical promotion if one is located.
