research_unit:
  id: R002
  title: "Cauchy — convergence, continuity, and rigor in analysis"
  period:
    approximate_start: 1815
    approximate_end: 1853
    core_period: "1821–1853"
  scope_summary: >
    Investigation of Cauchy's program for analysis based on limits and infinitesimals,
    his treatment of continuity and convergence, the 1821 theorem on sums of continuous
    functions, the interaction with trigonometric/Fourier series, and the later emergence
    of conditions now associated with uniform convergence. The packet treats modern
    epsilon-delta and uniform-convergence language as retrospective unless a source
    explicitly supports historical attribution.
  research_status: researched
  editorial_status: not_accepted
  generated_date: "2026-08-20"

research_questions:
  - id: q001
    question: "What did Cauchy mean by making analysis rigorous, and what mathematical practices was he trying to replace or control?"
  - id: q002
    question: "How did Cauchy define limit, infinitesimal quantity, continuity, and convergence in his own terminology?"
  - id: q003
    question: "What role did infinite series play in Cauchy's organization of analysis?"
  - id: q004
    question: "How did Fourier and trigonometric series intersect with Cauchy's work on convergence?"
  - id: q005
    question: "What exactly did Cauchy claim in 1821 about a convergent series of continuous functions, and why was the claim later restricted?"
  - id: q006
    question: "How did later work distinguish the stronger mode of convergence now called uniform convergence, and how directly should that development be credited to Cauchy?"
  - id: q007
    question: "Which apparent lines from Cauchy to later epsilon-delta analysis are historical continuities and which are modern reconstructions?"

