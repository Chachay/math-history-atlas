chronology:
  - date: "1821"
    event: >
      Cauchy publishes the first part of the Cours d'analyse, organizing algebraic
      analysis around limits, infinitesimal quantities, continuity, and convergence
      of series, and stating a theorem about sums of convergent series of continuous
      functions.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-bradley-sandifer-2009, src-arsac-2013]
    uncertainty: >
      The modern classification of Cauchy's definitions as epsilon-delta analysis or
      as equivalent to specific twentieth-century formulations is interpretive and must
      be kept separate from his own infinitesimal language.
  - date: "1823"
    event: >
      Cauchy's calculus lectures develop differential and integral calculus using his
      limit/infinitesimal framework.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1823]
    uncertainty: null
  - date: "1826-02-27"
    publication_year: 1827
    event: >
      Cauchy reads a memoir on periodic series in which he explicitly connects periodic
      expansions, including sine and cosine series, with mathematical physics and attempts
      a general proof of convergence.
    perspective: historical
    certainty: high
    sources: [src-cauchy-periodic-1827]
    uncertainty: >
      The memoir appears in volume 6 nominally associated with 1823 but was read in 1826
      and published in 1827; these date types must not be conflated.
  - date: "1826"
    event: >
      Abel notes an exception to Cauchy's 1821 continuity-of-the-sum theorem in work on
      the binomial series, using a trigonometric-series example to show that pointwise
      convergence of continuous terms does not by itself preserve continuity of the sum.
    perspective: historical
    certainty: medium_high
    sources: [src-abel-1826, src-arsac-2013]
    uncertainty: >
      The packet uses modern language such as pointwise convergence only to describe the
      mathematical relation; Abel did not formulate the issue with the later terminology
      of pointwise versus uniform convergence.
  - date: "1829"
    event: >
      Dirichlet publishes a rigorous convergence theorem for trigonometric series under
      explicit restrictions and criticizes Cauchy's attempted general proof.
    perspective: historical
    certainty: high
    sources: [src-dirichlet-1829, src-riemann-trig-history]
    uncertainty: >
      This is an intersection with R001 rather than evidence that Fourier's physical heat
      problem was the sole or direct motivation for Cauchy's broader program of rigor.
  - date: "1847–1848"
    event: >
      Stokes and Seidel formulate stronger conditions controlling convergence across the
      variable domain in work that later historians identify as part of the emergence of
      uniform convergence.
    perspective: later_interpretation
    certainty: medium_high
    sources: [src-weierstrass-uniform-history, src-arsac-2013]
    uncertainty: >
      Priority and exact dating vary across historical accounts, and the terminology
      "uniform convergence" was not yet standardized in the modern sense.
  - date: "1853-03-14"
    event: >
      Cauchy returns to his 1821 theorem, acknowledges exceptions for general series, and
      states a strengthened condition requiring the remainder to become small for all
      values of the variable between the given limits.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1853, src-arsac-2013]
    uncertainty: >
      Whether this should be described as Cauchy "discovering uniform convergence" is a
      historiographical interpretation. His text does not use the later term.

assertions:
  - id: r002-a001
    subject: work-cauchy-cours-1821
    predicate: organized_analysis_around
    object: concept-limit
    statement: >
      Cauchy's 1821 Cours d'analyse made limits a basic organizing notion for analysis
      rather than treating them as an incidental computational device.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-bradley-sandifer-2009]
    uncertainty: >
      This does not mean that Cauchy originated the mathematical idea of a limit or that
      no earlier rigorous arguments existed.
  - id: r002-a002
    subject: person-cauchy
    predicate: defined
    object: concept-infinitesimal
    statement: >
      Cauchy defined an infinitesimal quantity through a variable whose successive values
      decrease indefinitely so as to have zero as limit.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821]
    uncertainty: >
      Modern ontological interpretations of Cauchy's infinitesimals are disputed and are
      not resolved by this packet.
  - id: r002-a003
    subject: person-cauchy
    predicate: defined
    object: concept-continuity
    statement: >
      Cauchy characterized continuity by requiring an infinitely small increment of the
      independent variable to produce an infinitely small increment of the function
      within stated bounds.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-bradley-sandifer-2009]
    uncertainty: >
      Translating this directly into a modern pointwise or uniformly continuous epsilon-delta
      definition can suppress differences in quantifier structure and historical language.
  - id: r002-a004
    subject: work-cauchy-cours-1821
    predicate: developed
    object: concept-series-convergence
    statement: >
      Cauchy's 1821 treatment gave systematic convergence criteria for infinite series,
      including the condition now closely related to the Cauchy criterion for convergence.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-history-wrong-definitions-2026]
    uncertainty: >
      Naming the condition "the Cauchy criterion" is later terminology and does not imply
      that no antecedent formulations existed.
  - id: r002-a005
    subject: work-cauchy-cours-1821
    predicate: claimed
    object: concept-series-of-functions
    statement: >
      Cauchy stated that when the terms of a convergent series are continuous functions
      of the same variable in a neighborhood, the sum is also continuous there.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-arsac-2013]
    uncertainty: >
      Read with ordinary modern pointwise convergence, this statement is false without a
      stronger convergence hypothesis.
  - id: r002-a006
    subject: work-abel-binomial-1826
    predicate: exposed_exception_to
    object: r002-a005
    statement: >
      Abel explicitly pointed out an exception to Cauchy's theorem, using a trigonometric
      series whose continuous terms have a discontinuous limiting sum.
    perspective: historical
    certainty: medium_high
    sources: [src-abel-1826, src-arsac-2013]
    uncertainty: >
      The description "discontinuous limiting sum" is modern mathematical wording; the
      historical texts speak in terms of exceptions rather than the later taxonomy of
      convergence modes.
  - id: r002-a007
    subject: work-cauchy-periodic-1827
    predicate: connected
    object: concept-fourier-series
    statement: >
      Cauchy's periodic-series memoir explicitly states that many problems of mathematical
      physics require expansion of functions in periodic series, including sine and cosine
      series, and seeks a general convergence argument.
    perspective: historical
    certainty: high
    sources: [src-cauchy-periodic-1827]
    uncertainty: null
  - id: r002-a008
    subject: work-cauchy-periodic-1827
    predicate: attempted_general_proof_of
    object: concept-series-convergence
    statement: >
      Cauchy's 1826/1827 memoir attempted to establish convergence of periodic/trigonometric
      expansions in generality beyond special cases where coefficients could be evaluated directly.
    perspective: historical
    certainty: high
    sources: [src-cauchy-periodic-1827, src-riemann-trig-history]
    uncertainty: >
      Dirichlet and later Riemann regarded Cauchy's proof as insufficient; the assertion
      records the aim of the memoir, not the validity of its proof.
  - id: r002-a009
    subject: work-dirichlet-1829
    predicate: corrected_or_replaced
    object: r002-a008
    statement: >
      Dirichlet's 1829 paper supplied a rigorous convergence theorem under explicit
      restrictions and identified defects in Cauchy's attempted proof.
    perspective: historical
    certainty: high
    sources: [src-dirichlet-1829, src-riemann-trig-history]
    uncertainty: >
      "Corrected or replaced" refers to the convergence argument, not to every aspect of
      Cauchy's method or to all special cases.
  - id: r002-a010
    subject: work-cauchy-series-1853
    predicate: revised
    object: r002-a005
    statement: >
      In 1853 Cauchy acknowledged that the 1821 theorem admits exceptions for general
      series and strengthened the hypothesis by requiring the remainder to become
      arbitrarily small for all values of the variable in the specified interval.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1853, src-arsac-2013]
    uncertainty: >
      Cauchy did not use the later expression "uniform convergence" in this note.
  - id: r002-a011
    subject: concept-uniform-convergence
    predicate: later_clarified
    object: r002-a010
    statement: >
      Later historians identify Cauchy's 1853 strengthened condition as mathematically
      corresponding closely to a uniform Cauchy condition, while emphasizing that the
      terminology and conceptual packaging of uniform convergence developed through
      several authors rather than one isolated act.
    perspective: later_interpretation
    certainty: high
    sources: [src-arsac-2013, src-weierstrass-uniform-history]
    uncertainty: >
      Historiography differs on how much conceptual credit should be assigned to Cauchy,
      Seidel, Stokes, and Weierstrass.
  - id: r002-a012
    subject: concept-fourier-series
    predicate: intersected_with
    object: concept-series-convergence
    statement: >
      Fourier/trigonometric series formed one historically important testing ground in
      which general claims about convergence and continuity of infinite processes became
      mathematically consequential.
    perspective: later_interpretation
    certainty: high
    sources: [src-cauchy-periodic-1827, src-dirichlet-1829, src-arsac-2013]
    uncertainty: >
      This should not be rewritten as the stronger claim that Fourier's heat problem alone
      caused Cauchy's foundational program in analysis.
  - id: r002-a013
    subject: person-weierstrass
    predicate: developed
    object: concept-uniform-convergence
    statement: >
      Weierstrass developed an explicit and systematic treatment of convergence at the
      same rate in later lectures, but modern scholarship cautions against a simple linear
      genealogy from Cauchy through Seidel and Stokes to Weierstrass.
    perspective: later_interpretation
    certainty: high
    sources: [src-weierstrass-uniform-history]
    uncertainty: >
      The dating of Weierstrass's earliest use and the relation of unpublished 1840s work
      to later lecture formulations require careful source-specific treatment.

question_transitions:
  - id: r002-qt001
    from_question: q001
    to_question: q002
    relation: reframed_as
    statement: >
      Understanding Cauchy's rigor program requires reconstructing his own definitions of
      limit, infinitesimal, continuity, and convergence rather than importing later definitions.
    perspective: later_interpretation
    certainty: high
    sources: [src-cauchy-1821, src-bradley-sandifer-2009]
  - id: r002-qt002
    from_question: q002
    to_question: q003
    relation: extends_to
    statement: >
      Once limits and infinitesimals organize analysis, infinite series become a major domain
      in which limiting operations must be controlled.
    perspective: later_interpretation
    certainty: medium_high
    sources: [src-cauchy-1821, src-bradley-sandifer-2009]
  - id: r002-qt003
    from_question: q003
    to_question: q004
    relation: intersects_with
    statement: >
      Cauchy's general study of series intersects directly with periodic and trigonometric
      expansions in his 1826 memoir and with the convergence problem treated by Dirichlet.
    perspective: historical
    certainty: high
    sources: [src-cauchy-periodic-1827, src-dirichlet-1829]
  - id: r002-qt004
    from_question: q004
    to_question: q005
    relation: exposes_problem_in
    statement: >
      Trigonometric-series examples made visible that convergence of continuous terms does
      not automatically preserve continuity of the limiting sum, exposing a limitation of
      Cauchy's 1821 theorem.
    perspective: later_interpretation
    certainty: high
    sources: [src-abel-1826, src-arsac-2013]
  - id: r002-qt005
    from_question: q005
    to_question: q006
    relation: motivates_later_distinction
    statement: >
      Repairing the continuity-of-the-sum theorem requires control of convergence across the
      variable domain, a problem later organized under the concept of uniform convergence.
    perspective: later_interpretation
    certainty: high
    sources: [src-cauchy-1853, src-arsac-2013, src-weierstrass-uniform-history]
  - id: r002-qt006
    from_question: q006
    to_question: q007
    relation: requires_historiographical_check
    statement: >
      Because later epsilon-delta and uniform-convergence language can make the nineteenth-century
      development look more linear than it was, the final question is which continuities are
      genuinely historical and which are retrospective reconstruction.
    perspective: later_interpretation
    certainty: high
    sources: [src-bradley-sandifer-2009, src-weierstrass-uniform-history]

