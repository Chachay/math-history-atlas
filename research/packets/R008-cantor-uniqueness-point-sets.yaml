uncertainties:
  - id: r008-u001
    question: >
      What is the strongest primary documentary evidence for the exact direction of the Heine–Cantor exchange:
      who proposed the general uniqueness problem and who proposed the finite-exception generalization?
    status: open
    significance: high
    needed_evidence: >
      Heine p. 355 checked in full together with Cantor/Heine correspondence or a specialist history quoting
      the relevant primary documents. Until then avoid a one-way "Heine motivated Cantor" assertion.

  - id: r008-u002
    question: >
      Which precise Riemann propositions and Schwarz correspondence were used in Cantor's 1870 uniqueness proof?
    status: open
    significance: medium
    needed_evidence: >
      Primary or specialist locators connecting Riemann's formal double-integral machinery and Schwarz's lemma
      to Cantor's proof, sufficient to replace the current broad intermediary claim.

  - id: r008-u003
    question: >
      When did Cantor's later terminology for classes/species of point sets and transfinite iterations replace or
      extend the finite "nu-th kind" language of the 1872 paper?
    status: deferred
    significance: medium
    needed_evidence: >
      Cantor's 1879–1884 point-set papers and specialist historiography. This belongs to a later unit unless needed
      to prevent anachronism in R008.

  - id: r008-u004
    question: >
      How should the 1872 derived-set work be connected to the 1874 nondenumerability result without implying a
      direct causal jump from Fourier series to transfinite set theory?
    status: open
    significance: high
    needed_evidence: >
      Specialist historiography and, for a later unit, Cantor's 1873 correspondence and 1874 paper. Dauben already
      establishes that the 1872 paper alone is not an adequate direct-causation story.
