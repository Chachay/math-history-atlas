research_unit:
  id: R008
  title: Cantor — uniqueness of trigonometric series, exceptional sets, and point-set questions
  period:
    approximate_start: 1860
    approximate_end: 1885
    core_period: 1870–1872
  scope_summary: >
    Investigation of the uniqueness problem for trigonometric-series representations from
    Heine's 1870 treatment through Cantor's 1870, 1871, and 1872 uniqueness papers. The packet
    follows the mathematical change from uniqueness everywhere, through finitely many exceptional
    arguments, to infinite point sets controlled by finite iteration of derived sets. It treats
    the later connection to Cantorian set theory as a historiographic question rather than as an
    automatic causal consequence of Fourier series, and it does not retroject the later language
    of U-sets, Cantor–Bendixson rank, topology, or transfinite derived sets into the 1870–1872 work.
  origin_pattern: internal_mathematical_development
  prior_mathematical_problem: >
    Trigonometric representation had raised distinct questions of representability, convergence,
    and uniqueness. Riemann's work enlarged the admissible analytic setting without making
    uniqueness a settled consequence of convergence or integrability.
  generated_date: '2026-08-20'
  research_status: researched
  editorial_status: not_accepted

research_questions:
  - id: q001
    question: What uniqueness problem for trigonometric series was being discussed by Heine and Cantor around 1870?
  - id: q002
    question: What hypotheses did Cantor remove in moving beyond Heine's result?
  - id: q003
    question: What exactly changed when Cantor allowed finitely many exceptional points in 1871?
  - id: q004
    question: What class of infinite exceptional point sets is covered by Cantor's 1872 extension?
  - id: q005
    question: When and how does Cantor introduce the operation of passing from a point set to its set of limit points?
  - id: q006
    question: Which terminology in modern uniqueness theory is retrospective rather than Cantor's own terminology?
  - id: q007
    question: How strong is the historical claim that work on trigonometric series caused or produced Cantor's later set theory?
  - id: q008
    question: What roles should be assigned to Heine, Riemann, Schwarz, and Weierstrass rather than crediting the development to Cantor alone?

