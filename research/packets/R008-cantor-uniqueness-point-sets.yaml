chronology:
  - date: '1870'
    date_type: journal_volume_publication
    event: >
      Heine published a treatment of trigonometric series that made uniqueness an explicit issue
      under hypotheses including general uniform convergence, with "im allgemeinen" allowing only
      finitely many exceptional points in the stated conventions.
    perspective: historical
    certainty: high
    sources: [src-heine-1870, src-halle-heine]
    primary_locator: 'J. reine angew. Math. 71, pp. 353–365; especially p. 355'
    uncertainty: >
      EuDML metadata labels the item 1869 while the journal issue, Halle bibliography, and standard
      citation use 1870. Treat 1870 as the issue/publication convention and retain the discrepancy.

  - date: '1870'
    date_type: publication
    event: >
      Cantor proved that if a function is represented for every real x by a convergent trigonometric
      series, the representation is unique; equivalently, a trigonometric series converging to zero
      everywhere has all coefficients zero.
    perspective: historical
    certainty: high
    sources: [src-cantor-1870-uniqueness]
    primary_locator: 'J. reine angew. Math. 72, pp. 139–142'
  - date: '1871'
    date_type: publication
    event: >
      In a note explicitly referring back to the 1870 uniqueness paper, Cantor showed that the
      conclusion persists when convergence or equality of the represented sums is abandoned at a
      finite number of values of x.
    perspective: historical
    certainty: high
    sources: [src-cantor-1871-note, src-cantor-1872-extension]
    primary_locator: 'J. reine angew. Math. 73, pp. 294–296; retrospective summary in Cantor 1872, opening paragraph'

  - date: '1872'
    date_type: publication
    event: >
      Cantor extended the uniqueness theorem to certain infinite exceptional point sets. He defined
      the derived set P' of a point set P as the set of its limit points and iterated the operation.
      His theorem covers a set P for which, after a finite number nu of derivations, P^(nu) consists
      of finitely many points and hence has no further derived set.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension]
    primary_locator: 'Math. Ann. 5, pp. 123–132, especially §2 and §3'
    uncertainty: >
      The later compression "finite Cantor–Bendixson rank" is mathematically convenient but is not
      Cantor's 1872 terminology and is excluded from the historical wording.

  - date: '1872'
    date_type: publication
    event: >
      The same paper develops a construction of real number magnitudes by fundamental sequences of
      rationals because Cantor says preparatory definitions are needed for a compact statement and
      proof of the intended uniqueness extension.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension, src-trinity-cantor-1872]
    primary_locator: 'opening paragraph and §1'

  - date: '1874'
    date_type: publication
    event: >
      Cantor's paper on real algebraic numbers belongs to a later phase in which countability and the
      non-equivalence of infinite totalities became central. This is kept chronologically distinct
      from the 1872 uniqueness/derived-set paper.
    perspective: later_interpretation
    certainty: high
    sources: [src-dauben-1979, src-halle-cantor]
    uncertainty: >
      R008 does not research the 1874 proof itself; the entry only prevents the later transfinite
      trajectory from being folded back into 1872.

assertions:
  - id: r008-a001
    subject: work-heine-trig-1870
    predicate: raised_question
    object: concept-trig-series-uniqueness
    statement: >
      Heine's trigonometric-series paper explicitly treats uniqueness and proves it under conditions
      that include general uniform convergence; his convention permits finitely many exceptional points.
    perspective: historical
    certainty: high
    sources: [src-heine-1870, src-halle-heine]

  - id: r008-a002
    subject: person-cantor
    predicate: contributed_to
    object: concept-trig-series-uniqueness
    statement: >
      Cantor's 1870 paper removes the uniform-convergence restriction from the uniqueness conclusion
      by proving uniqueness for a trigonometric series converging pointwise for every real x.
    perspective: historical
    certainty: high
    sources: [src-cantor-1870-uniqueness, src-scoville-2012]

  - id: r008-a003
    subject: work-cantor-uniqueness-note-1871
    predicate: generalized
    object: concept-trig-series-uniqueness
    statement: >
      Cantor's 1871 note extends his uniqueness theorem so that finitely many x-values may be excepted
      from convergence or agreement of the represented sums.
    perspective: historical
    certainty: high
    sources: [src-cantor-1871-note, src-cantor-1872-extension]

  - id: r008-a004
    subject: work-cantor-extension-1872
    predicate: generalized
    object: concept-exceptional-point-set
    statement: >
      Cantor's 1872 paper asks how an infinite collection of exceptional x-values can be admitted
      without destroying the uniqueness theorem and formulates a sufficient condition using finite
      iteration of derived point sets.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension]

  - id: r008-a005
    subject: work-cantor-extension-1872
    predicate: contributed_to
    object: concept-derived-set
    statement: >
      Cantor defines P' as the set of limit points of a point set P, considers P'', P''', and finite
      iterates P^(nu), and uses this structure in the statement and proof of his uniqueness extension.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension]

  - id: r008-a006
    subject: concept-exceptional-point-set
    predicate: contributed_to
    object: concept-derived-set
    statement: >
      In the 1872 paper, the need to characterize admissible infinite exceptional point sets is the
      immediate setting in which the derived-set operation is introduced and used.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension, src-scoville-2012]

  - id: r008-a007
    subject: work-cantor-extension-1872
    predicate: contributed_to
    object: concept-trig-series-uniqueness
    statement: >
      The 1872 theorem establishes uniqueness when the exceptional set is of a finite derived-set
      type in Cantor's sense: some finite iterate consists of finitely many points and therefore has
      no further derived set.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension]
  - id: r008-a008
    subject: person-heine
    predicate: contributed_to
    object: concept-trig-series-uniqueness
    statement: >
      Later historical accounts place Heine's Halle work and discussions with Cantor immediately
      upstream of Cantor's entry into the uniqueness problem, but the exact direction of particular
      suggestions between Heine and Cantor is not fixed here as a primary-source causal claim.
    perspective: later_interpretation
    certainty: medium
    sources: [src-dauben-1979, src-halle-heine, src-scoville-2012]
    uncertainty: >
      Secondary accounts differ in how they narrate who suggested which generalization. A precise
      correspondence or a checked primary locator in Heine is needed before using "Heine motivated
      Cantor" or an equally strong one-way predicate.

  - id: r008-a009
    subject: person-riemann
    predicate: contributed_to
    object: concept-trig-series-uniqueness
    statement: >
      Riemann's trigonometric-series work supplied analytic machinery used in the Heine/Cantor
      uniqueness setting, so Riemann is an intermediary in the mathematical background rather than
      merely a chronological predecessor.
    perspective: later_interpretation
    certainty: medium
    sources: [src-riemann-1867, src-halle-heine, src-scoville-2012]
    uncertainty: >
      The packet has not yet pinned every step of Cantor's 1870 proof to a precise Riemann passage;
      promotion should avoid a stronger direct-influence claim without that locator.

  - id: r008-a010
    subject: work-cantor-extension-1872
    predicate: contributed_to
    object: concept-derived-set
    statement: >
      Later historians regard the 1872 paper as a concrete analytic origin of Cantor's sustained
      investigation of point sets, but this does not make the full later transfinite theory already
      present in the paper.
    perspective: later_interpretation
    certainty: high
    sources: [src-dauben-1979, src-scoville-2012]

  - id: r008-a011
    subject: work-cantor-extension-1872
    predicate: contributed_to
    object: work-cantor-algebraic-reals-1874
    statement: >
      Cantor's 1872 point-set work and his 1874 investigation of infinite numerical totalities belong
      to a developing research trajectory, but specialist historiography explicitly warns that
      transfinite set theory did not follow immediately from the 1872 trigonometric-series paper.
    perspective: later_interpretation
    certainty: medium
    sources: [src-dauben-1979]
    uncertainty: >
      This is a bounded historiographic handoff, not a claim that the 1872 uniqueness theorem caused
      the 1874 result or later transfinite arithmetic.

  - id: r008-a012
    subject: concept-derived-set
    predicate: contributed_to
    object: concept-exceptional-point-set
    statement: >
      Modern uniqueness theory can redescribe Cantor's 1872 exceptional sets using later notions such
      as uniqueness sets and finite Cantor–Bendixson complexity, but those labels are modern abstractions
      and must not be presented as Cantor's contemporary vocabulary.
    perspective: modern_abstraction
    certainty: high
    sources: [src-eom-uniqueness-set, src-cantor-1872-extension]

question_transitions:
  - id: r008-qt001
    from_question: q-trig-representation-scope
    to_question: q-trig-series-uniqueness
    relation: >
      Once trigonometric representation is considered beyond restricted formula classes, existence and
      convergence do not settle whether the representing coefficients are uniquely determined; Heine and
      Cantor treat uniqueness as a distinct mathematical problem.
    perspective: later_interpretation
    certainty: high
    sources: [src-heine-1870, src-cantor-1870-uniqueness, src-scoville-2012]

  - id: r008-qt002
    from_question: q-fourier-series-convergence
    to_question: q-trig-series-uniqueness
    relation: >
      The 1870 uniqueness problem separates the question whether a trigonometric series converges to a
      function from the question whether two convergent trigonometric series can represent the same function.
    perspective: later_interpretation
    certainty: high
    sources: [src-heine-1870, src-cantor-1870-uniqueness]

  - id: r008-qt003
    from_question: q-trig-series-uniqueness
    to_question: q-exceptional-set-uniqueness
    relation: >
      Cantor's own sequence of 1870, 1871, and 1872 papers progressively asks how much failure of convergence
      or agreement at exceptional x-values can be tolerated while retaining uniqueness.
    perspective: historical
    certainty: high
    sources: [src-cantor-1871-note, src-cantor-1872-extension]

  - id: r008-qt004
    from_question: q-exceptional-set-uniqueness
    to_question: q-derived-set-structure
    relation: >
      To state a uniqueness result for certain infinite exceptional sets, Cantor introduces repeated passage
      to limit-point sets and thereby makes the internal structure of point sets itself mathematically relevant.
    perspective: historical
    certainty: high
    sources: [src-cantor-1872-extension]

  - id: r008-qt005
    from_question: q-derived-set-structure
    to_question: q-later-infinite-set-structure
    relation: >
      Later Cantorian set theory can be read as developing from a research trajectory in which point sets had
      become mathematical objects, but the 1872 paper alone does not establish a direct causal transition to
      transfinite set theory; the 1874 nondenumerability result and later work form distinct stages.
    perspective: later_interpretation
    certainty: medium
    sources: [src-dauben-1979]

canonical_question_candidates:
  - id: q-trig-series-uniqueness
    question: When is a trigonometric-series representation unique?
    period: {from: 1870, to: null}
    fields: [analysis]
  - id: q-exceptional-set-uniqueness
    question: Which exceptional point sets can be tolerated without destroying uniqueness of trigonometric representation?
    period: {from: 1871, to: null}
    fields: [analysis]
  - id: q-derived-set-structure
    question: How can an infinite point set be analyzed by repeatedly passing to its limit points?
    period: {from: 1872, to: null}
    fields: [analysis]
  - id: q-later-infinite-set-structure
    question: What structural distinctions among infinite sets become mathematically significant beyond the first derived-set questions?
    period: {from: 1874, to: null}
    fields: [analysis]
    boundary_note: downstream handoff only; not proposed for canonical promotion within R008 without later-unit research

intersection_candidates:
  - id: r008-i001
    with: R001
    refs: [q-trig-representation-scope, q-fourier-series-convergence, q-trig-series-uniqueness]
    significance: >
      R008 branches from the established representation/convergence line into uniqueness; this is a reviewed
      mathematical-question intersection, not a claim of direct Fourier-to-Cantor personal influence.
  - id: r008-i002
    with: R003
    refs: [q-dirichlet-admissible-functions, q-trig-series-uniqueness]
    significance: >
      Dirichlet-era restrictions on admissible functions form part of the analytical background, while R008
      asks the different question of uniqueness after a representation is given. The intersection should remain
      conceptual unless direct transmission evidence is added.
  - id: r008-i003
    with: R004
    refs: [q-fourier-series-convergence, q-post-riemann-integration-gap, q-trig-series-uniqueness, person-riemann]
    significance: >
      Riemann's trigonometric-series work is an explicit mathematical intermediary in the setting inherited by
      Heine and Cantor. R008 should connect through the trigonometric-series problem, not by claiming that
      Riemann's integral criterion itself caused Cantor's point-set work.

concept_state_candidates:
  - id: r008-cs-uniqueness-1870
    concept_id: concept-trig-series-uniqueness
    period: {from: 1870, to: 1870}
    label: >
      Uniqueness is formulated as vanishing of every coefficient when a convergent trigonometric series has
      zero sum for every real argument, without assuming uniform convergence.
  - id: r008-cs-exceptional-1871
    concept_id: concept-exceptional-point-set
    period: {from: 1871, to: 1871}
    label: >
      A finite number of exceptional arguments may be omitted from convergence or equality without destroying
      the uniqueness conclusion.
  - id: r008-cs-derived-1872
    concept_id: concept-derived-set
    period: {from: 1872, to: 1872}
    label: >
      For a linear point set P, P' is the set of limit points of P; finite iteration P', P'', ... is used to
      distinguish sets whose nu-th derivative is finite and has no further derivative.

story_candidates:
  - story_id: story-uniqueness
    title: When is a representation unique?
    integration_plan: >
      Begin at the established Fourier/Riemann representation-convergence line, make uniqueness a distinct
      question through Heine and Cantor, then follow Cantor's progression from no exceptions to finite
      exceptions and to infinite exceptional point sets described by derived sets. End with an explicit
      historiographic boundary: this supplies a real analytic route into point-set questions, but the Story
      must not say that Fourier series simply "created set theory" or import later transfinite/cardinality
      results into the 1872 step.

