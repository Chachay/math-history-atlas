research_unit:
  id: R005
  title: Weierstrass and quantified control of limits — continuity, convergence, and ε–δ language
  period:
    approximate_start: 1817
    approximate_end: 1886
    core_period: 1840–1880
  scope_summary: >
    Investigation of the nineteenth-century move from verbal and infinitesimal descriptions of
    arbitrarily small change toward explicit quantified control by inequalities and variable bounds.
    The packet treats Bolzano and Cauchy as antecedents, Weierstrass's lecture tradition as a central
    but textually mediated development, and Heine as an important published formulation. It tests
    rather than assumes a single-inventor account of epsilon-delta rigor. Lecture date, manuscript-note
    date, publication date, and later edited-publication date are kept distinct. Real-number completeness
    and twentieth-century formalism remain downstream questions rather than being absorbed into R005.
  research_status: researched
  editorial_status: not_accepted
  generated_date: '2026-08-20'

research_questions:
  - id: q001
    question: What mathematical work was explicit control by inequalities and variable bounds doing in Weierstrass's analysis?
  - id: q002
    question: What evidence survives for the chronology and wording of quantified continuity and convergence formulations in Weierstrass's lectures?
  - id: q003
    question: How should Bolzano's and Cauchy's earlier formulations be compared with later epsilon-delta language without rewriting them as modern definitions?
  - id: q004
    question: What role did Heine and other intermediaries play in moving quantified formulations into published function theory?
  - id: q005
    question: When did epsilon and delta become stable notation rather than isolated symbols or retrospective modernization?
  - id: q006
    question: How does quantified local control intersect historically with the stronger convergence control already represented in R002?
  - id: q007
    question: How much of the phrase arithmetization of analysis is contemporary program and how much is later historiography?
  - id: q008
    question: What foundational question remains once limit and continuity statements receive more explicit quantified control?

