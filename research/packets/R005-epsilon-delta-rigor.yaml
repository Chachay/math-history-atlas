chronology:
  - date: '1817'
    date_type: publication
    event: >
      Bolzano publishes a definition of continuity using the requirement that the change
      f(x+ω)-f(x) can be made smaller than any given quantity when ω is taken sufficiently small.
    perspective: historical
    certainty: high
    sources: [src-bolzano-1817, src-rusnock-sebestik-2019]
    uncertainty: >
      The formulation is historically important quantified-smallness language, but it does not use
      epsilon-delta notation and should not be silently rewritten in the modern nested-quantifier syntax.

  - date: '1821'
    date_type: publication
    event: >
      Cauchy's Cours d'Analyse defines limit, infinitesimal quantity, and continuity in the language
      of variable quantities and infinitesimal increments.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-grabiner-1983]
    uncertainty: >
      Later epsilon-delta paraphrases of Cauchy's continuity definition are useful mathematically but
      are not Cauchy's own 1821 wording.

  - date: '1823'
    date_type: publication
    event: >
      In his lessons on infinitesimal calculus Cauchy uses epsilon and delta in inequality-based error
      control within a proof, furnishing evidence that such symbols and techniques predate Weierstrass.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1823, src-grabiner-1983, src-sinkevich-2016]
    uncertainty: >
      This is evidence for an inequality technique in a particular argument, not evidence that Cauchy
      stated the modern epsilon-delta definition of limit or continuity as a general definition.

  - date: '1861'
    date_type: lecture_and_student_notes
    event: >
      H. A. Schwarz records Weierstrass's Differentialrechnung lectures at the Königliches
      Gewerbeinstitut in Berlin. The surviving notes contain an explicit bound δ on the increment h
      corresponding to an arbitrarily small ε in the discussion of continuity, and the same 1861
      teaching also contains Weierstrass's earliest verifiable treatment of convergence at the same rate.
    perspective: historical
    certainty: medium
    sources: [src-sinkevich-2016, src-viertel-2021]
    uncertainty: >
      The evidence is mediated by a student's private notes rather than a Weierstrass-authored or
      Weierstrass-supervised publication. The date is therefore a lecture/note date, not a publication date.

  - date: '1870-1871'
    date_type: lecture_course
    event: >
      Surviving lecture-note evidence shows Weierstrass using gleichmäßig for the convergence concept
      later organized as uniform convergence, replacing his earlier language of convergence at the same rate.
    perspective: historical
    certainty: high
    sources: [src-viertel-2021]
    uncertainty: >
      Viertel stresses that different lecture-note formulations correspond variously to uniform convergence
      and to a uniform Cauchy condition; later terminology should not flatten those distinctions.

  - date: '1872'
    date_type: publication
    event: >
      Heine publishes Die Elemente der Functionenlehre, including a pointwise continuity condition in
      explicit small-error/small-increment form and a definition of uniform continuity in epsilon-delta terms.
    perspective: historical
    certainty: high
    sources: [src-heine-1872, src-sinkevich-2016]
    uncertainty: >
      Heine himself states that Weierstrass's principles circulated through lectures, oral communication,
      and manuscript copies without having been published under Weierstrass's supervision. This supports
      circulation but does not by itself establish a unique line of conceptual priority for every definition.

  - date: '1894'
    date_type: later_edited_publication
    event: >
      Weierstrass's 1841 paper Zur Theorie der Potenzreihen appears in his collected works with language
      associated with uniform convergence, but modern source criticism finds strong indications that its
      terminology and notation were revised later.
    perspective: later_interpretation
    certainty: high
    sources: [src-viertel-2021]
    uncertainty: >
      The 1841 signature date must not be treated automatically as the date of the wording printed in 1894.

assertions:
  - id: r005-a001
    subject: work-bolzano-1817
    predicate: contributed_to
    object: concept-continuity
    statement: >
      Bolzano's 1817 continuity definition controls the change of a function by requiring it to become
      smaller than any prescribed quantity when an increment ω is taken sufficiently small; this is an
      antecedent of quantified control but is expressed in Bolzano's own variable-quantity language.
    perspective: historical
    certainty: high
    sources: [src-bolzano-1817, src-rusnock-sebestik-2019]
    uncertainty: >
      Calling this simply the modern epsilon-delta definition would erase differences in notation,
      quantifier presentation, and Bolzano's theory of quantities.

  - id: r005-a002
    subject: work-cauchy-cours
    predicate: contributed_to
    object: concept-continuity
    statement: >
      Cauchy's 1821 definition makes continuity depend on an infinitesimal increment of the independent
      variable producing an infinitesimal change in the function, within his theory of variable quantities.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1821, src-grabiner-1983]
    uncertainty: >
      The assertion records Cauchy's language rather than treating infinitesimals as evidence that he
      misunderstood limits or replacing his wording with a twentieth-century epsilon-delta formula.

  - id: r005-a003
    subject: work-cauchy-calcul-1823
    predicate: contributed_to
    object: concept-quantified-control
    statement: >
      Cauchy's 1823 calculus text contains an inequality argument using epsilon and delta to express
      controllably small error, showing that epsilon/delta symbols and inequality-based proof techniques
      were in use before Weierstrass's Berlin lectures.
    perspective: historical
    certainty: high
    sources: [src-cauchy-1823, src-grabiner-1983, src-sinkevich-2016]
    uncertainty: >
      This does not establish that Cauchy gave a general modern epsilon-delta definition, nor that his δ
      was systematically presented as depending on an arbitrarily prescribed ε.

  - id: r005-a004
    subject: work-weierstrass-schwarz-notes-1861
    predicate: contributed_to
    object: concept-quantified-control
    statement: >
      Schwarz's notes from Weierstrass's 1861 Differentialrechnung lectures record a continuity formulation
      in which a bound δ is chosen for the increment h so that the corresponding change of the function is
      smaller than an arbitrarily small ε.
    perspective: historical
    certainty: medium
    sources: [src-sinkevich-2016]
    uncertainty: >
      The mathematical wording is reported through a later scholarly transcription of private student notes;
      this packet therefore avoids the stronger claim that a Weierstrass-authored 1861 publication contains
      the modern textbook definition.

  - id: r005-a005
    subject: person-weierstrass
    predicate: contributed_to
    object: concept-uniform-convergence
    statement: >
      In surviving 1861 lecture notes Weierstrass introduced convergence 'at the same rate' in the context
      of controlling infinite series, continuity, and termwise differentiation, providing an early verifiable
      branch of the development later organized as uniform convergence.
    perspective: later_interpretation
    certainty: high
    sources: [src-viertel-2021]
    uncertainty: >
      Viertel distinguishes formulations that correspond to uniform convergence from formulations closer
      to a uniform Cauchy condition; the modern concept label is therefore retrospective.

  - id: r005-a006
    subject: work-weierstrass-schwarz-notes-1861
    predicate: contributed_to
    object: concept-continuity
    statement: >
      The same 1861 lecture-note evidence places quantified local control of continuity and stronger
      convergence control within Weierstrass's teaching environment, but it does not establish that one
      of these developments historically caused the other.
    perspective: later_interpretation
    certainty: medium
    sources: [src-sinkevich-2016, src-viertel-2021]
    uncertainty: >
      The conjunction is a documented intersection in one lecture tradition; causal language such as
      'uniform convergence produced epsilon-delta analysis' is not supported.

  - id: r005-a007
    subject: work-heine-functionenlehre-1872
    predicate: contributed_to
    object: concept-quantified-control
    statement: >
      Heine's 1872 published function theory states pointwise continuity using an arbitrarily small positive
      error and a corresponding positive bound on the increment, and also formulates uniform continuity
      in epsilon-delta terms.
    perspective: historical
    certainty: high
    sources: [src-heine-1872, src-sinkevich-2016]
    uncertainty: >
      This establishes a published formulation and circulation point, not a claim that Heine alone
      standardized all later epsilon-delta notation.

  - id: r005-a008
    subject: person-weierstrass
    predicate: contributed_to
    object: concept-quantified-control
    statement: >
      The historically defensible role of Weierstrass is not a single published invention event but a
      sustained lecture-based development of explicit control conditions whose surviving formulations
      can be traced from 1861 and whose principles circulated among students and colleagues.
    perspective: later_interpretation
    certainty: high
    sources: [src-sinkevich-2016, src-viertel-2021, src-heine-1872]
    uncertainty: >
      Priority depends on what is being dated: isolated symbols, inequality proof practice, a quantified
      definition, a lecture formulation, or a published formulation.

  - id: r005-a009
    subject: person-weierstrass
    predicate: contributed_to
    object: concept-limit
    statement: >
      Later historiography associates Weierstrass's Berlin teaching with the systematic epsilon-delta
      formulation of limit and continuity, but the evidence used for the 1861 date is lecture-note evidence
      and should not be converted into a claim about a uniquely identifiable 1861 publication.
    perspective: later_interpretation
    certainty: medium
    sources: [src-sinkevich-2016]
    uncertainty: >
      A stronger priority claim requires direct specialist treatment of the Schwarz manuscript/transcription
      and competing earlier formulations, not merely a modern textbook genealogy.

  - id: r005-a010
    subject: work-weierstrass-schwarz-notes-1861
    predicate: contributed_to
    object: q-uniform-convergence-emergence
    statement: >
      Weierstrass's 1861 lecture tradition provides a genuine intersection with the R002 question about
      stronger convergence control because the same-rate condition is introduced while treating infinite
      series and operations on their sums.
    perspective: later_interpretation
    certainty: high
    sources: [src-viertel-2021]
    uncertainty: >
      This intersection does not support a linear Cauchy-to-Weierstrass transmission: Viertel reports no
      known explicit Weierstrass reference in this context to Cauchy's 1821/1853 theorem or to Seidel and Stokes.

question_transitions:
  - id: r005-qt001
    from_question: q-cauchy-rigor
    to_question: q-quantified-limit-control
    relation: >
      The Atlas can retrospectively distinguish Cauchy's variable-quantity/infinitesimal framework from the
      later question of how smallness is to be controlled by explicit nested bounds.
    perspective: later_interpretation
    certainty: high
    sources: [src-cauchy-1821, src-grabiner-1983, src-sinkevich-2016]
    note: >
      This is a historiographical comparison, not evidence that Cauchy himself posed a future Weierstrassian
      epsilon-delta problem.

  - id: r005-qt002
    from_question: q-uniform-convergence-emergence
    to_question: q-quantified-limit-control
    relation: >
      Weierstrass's 1861 teaching makes stronger convergence control and quantified local variation intersect
      in the same lecture environment, while the evidence does not establish that the former caused the latter.
    perspective: later_interpretation
    certainty: medium
    sources: [src-viertel-2021, src-sinkevich-2016]
    note: >
      This is deliberately weaker than a 'uniform convergence motivated epsilon-delta analysis' claim.

  - id: r005-qt003
    from_question: q-quantified-limit-control
    to_question: q-epsilon-delta-circulation
    relation: >
      The historical problem shifts from identifying quantified formulations in lecture notes to tracing how
      such formulations entered published function theory and became reproducible conventions.
    perspective: later_interpretation
    certainty: high
    sources: [src-heine-1872, src-sinkevich-2016]
    note: >
      Heine's 1872 publication provides a concrete publication anchor, but 'standardization' remains a broader
      process and is not assigned to one text.

  - id: r005-qt004
    from_question: q-epsilon-delta-circulation
    to_question: q-real-number-completeness
    relation: >
      Explicit control of limits and continuity does not by itself settle what guarantees existence and
      completeness of the underlying real-number system, leaving a separate foundational question.
    perspective: modern_abstraction
    certainty: high
    sources: [src-rusnock-sebestik-2019, src-sinkevich-2016]
    note: >
      This is a bounded downstream handoff, not a claim that epsilon-delta notation historically caused
      Dedekind's, Cantor's, or Weierstrass's constructions of the real numbers.

intersection_candidates:
  - id: r005-i001
    with: R002
    refs: [q-uniform-convergence-emergence, concept-uniform-convergence, person-weierstrass]
    significance: >
      Weierstrass's 1861 teaching is a source-supported intersection between stronger domain-wide convergence
      control and local quantified control. It should be rendered as an intersection or branch, not as a
      single causal handoff from uniform convergence to epsilon-delta analysis.

  - id: r005-i002
    with: R002
    refs: [concept-continuity, concept-limit, concept-infinitesimal, person-cauchy]
    significance: >
      R005 revisits Cauchy's definitions only to compare historical languages of smallness; it should reuse
      the existing Cauchy canonical nodes and preserve R002's rejection of the caricature that infinitesimal
      language meant a failure to understand limits.

concept_state_candidates:
  - id: r005-cs-continuity-1817-1823
    concept_id: concept-continuity
    period: {from: 1817, to: 1823}
    label: >
      Continuity can be articulated through variable increments becoming arbitrarily small, with Bolzano and
      Cauchy using historically distinct quantity/infinitesimal frameworks rather than a shared modern syntax.

  - id: r005-cs-quantified-control-1861
    concept_id: concept-quantified-control
    period: {from: 1861, to: 1861}
    label: >
      Student notes from Weierstrass's teaching record an explicit bound on input variation corresponding to
      an arbitrarily small allowed function variation.

  - id: r005-cs-quantified-control-1872
    concept_id: concept-quantified-control
    period: {from: 1872, to: 1872}
    label: >
      Heine's published function theory gives explicit small-error/small-increment conditions for continuity
      and uniform continuity, making quantified control visible in print beyond Weierstrass's lecture tradition.

story_candidates:
  - story_id: story-epsilon-delta-control
    title: How precisely must “arbitrarily close” be controlled?
    integration_plan: >
      Begin from Cauchy's inherited limit/continuity framework without presenting it as defective; use Bolzano
      and Cauchy's inequality practices as antecedents; move to the textually mediated 1861 Weierstrass lecture
      evidence; intersect R002 at same-rate convergence without asserting causation; then use Heine 1872 as a
      publication/circulation anchor. End with the unresolved foundation of the real-number continuum rather
      than treating epsilon-delta notation as the completion of rigor.

