uncertainties:
  - id: r005-u001
    issue: Weierstrass 1861 priority and exact wording
    status: open
    detail: >
      The central 1861 evidence survives through H. A. Schwarz's private student notes and later historical
      reproduction. R005 can safely date a surviving lecture-note formulation to 1861, but a claim such as
      'Weierstrass invented the epsilon-delta definition in 1861' compresses authorship, textual transmission,
      and priority into one statement and should remain rejected unless stronger manuscript-level comparison
      with earlier formulations is supplied.

  - id: r005-u002
    issue: Bolzano-to-later-analysis transmission
    status: open
    detail: >
      Bolzano's 1817 formulation is an important antecedent, but this packet does not establish a direct
      transmission from Bolzano to Weierstrass or Heine. Mathematical resemblance is not historical influence.

  - id: r005-u003
    issue: Uniform convergence as cause of epsilon-delta analysis
    status: open
    detail: >
      Weierstrass's lecture tradition contains both stronger convergence control and quantified continuity
      formulations. The available evidence supports an intersection, not the causal claim that uniform
      convergence generated epsilon-delta analysis.

  - id: r005-u004
    issue: Arithmetization of analysis as a contemporary program label
    status: open
    detail: >
      The phrase is common in later historiography, but this packet has not located a primary Weierstrass text
      that licenses treating it as his own single named program with a unique start date. Any canonical use
      should remain later_interpretation unless stronger primary evidence is added.

  - id: r005-u005
    issue: Stabilization of epsilon and delta as conventional notation
    status: open
    detail: >
      Heine 1872 supplies a concrete printed formulation and later authors extend the language, but one text
      is insufficient to establish when the notation became generally stable across analysis. R005 should
      avoid a universal standardization date.

  - id: r005-u006
    issue: Downstream completeness question
    status: bounded_handoff
    detail: >
      More explicit quantified definitions presuppose a number domain on which limits and bounds operate.
      Construction/completeness of the real numbers is a natural subsequent research unit, but Dedekind,
      Cantor, Méray, and Weierstrass's number concepts are not researched here in enough depth for promotion.
