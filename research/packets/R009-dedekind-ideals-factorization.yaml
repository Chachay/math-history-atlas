intersection_candidates:
- id: r009-int001
  with: R006
  type: cautious_cross_story_intersection
  basis: >
    Dedekind's 1871 number-field discussion explicitly refers to Galoisian principles when discussing
    conjugate fields, while R006 already contains roots, substitutions, and the later question of fields
    as algebraic objects. This supports shared mathematical territory, not a direct motivation claim.
  certainty: medium
  sources: [src-r009-dedekind-1871-avigad]
- id: r009-int002
  with: future-abstract-algebra
  type: downstream_modern_relation
  basis: >
    Later abstract ring and module theory generalizes the ideal structures seen here. This is a future
    handoff and must not be written as Dedekind already working in twentieth-century commutative algebra.
  certainty: high
  sources: [src-r009-sep-dedekind]

concept_state_candidates:
- id: r009-cs001
  concept: concept-ideal-divisor
  period: {from: 1847, to: 1870}
  label: >
    Kummer's ideal divisors are characterized through divisibility behavior in cyclotomic integer domains;
    they should not be silently identified with Dedekind's later sets/systems.
- id: r009-cs002
  concept: concept-dedekind-ideal
  period: {from: 1871, to: 1876}
  label: >
    Dedekind's first formulation uses systems of integers together with a substantial dependence on
    simple ideals represented through congruences.
- id: r009-cs003
  concept: concept-dedekind-ideal
  period: {from: 1877, to: 1894}
  label: >
    Dedekind's later presentations increasingly foreground abstract operations and properties of ideals
    rather than particular congruence representations.

story_candidates:
- id: r009-story-candidate-001
  title: What survives when unique factorization fails?
  question_spine: [q001, q002, q003, q005, q006]
  proposed_arc: >
    Begin with the arithmetic tension created by failed element factorization; introduce Kummer's ideal
    divisors as an earlier response; follow Dedekind's replacement of indirect divisibility talk by systems
    of algebraic integers; show how prime-ideal decomposition restores a structural analogue of arithmetic;
    end by separating the historical theory from its later ring-theoretic abstraction.
  integration_note: >
    If R006 appears, use it as a restrained intersection around algebraic numbers/fields rather than as
    the opening cause of R009.

