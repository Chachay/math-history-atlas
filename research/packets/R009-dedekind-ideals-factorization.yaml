assertions:
- id: r009-a001
  subject: work-kummer-1847-complex-numbers
  predicate: contributed_to
  object: concept-ideal-divisor
  period: {from: 1847, to: 1847}
  perspective: historical
  certainty: high
  sources: [src-r009-kummer-1847, src-r009-avigad-2004]
  claim: >
    Kummer's 1847 work introduced ideal divisors/ideal complex numbers in the cyclotomic setting as a
    way to recover arithmetic decomposition behavior that ordinary factors did not provide.
- id: r009-a002
  subject: concept-ideal-divisor
  predicate: contributed_to
  object: concept-dedekind-ideal
  period: {from: 1847, to: 1871}
  perspective: historical
  certainty: high
  sources: [src-r009-avigad-2004, src-r009-edwards-1980]
  claim: >
    Dedekind's ideal theory explicitly addressed the problem previously treated through Kummer's ideal
    divisors, while replacing indirect divisibility predicates with systems of algebraic integers.
- id: r009-a003
  subject: work-dedekind-1871-supplement
  predicate: contributed_to
  object: concept-algebraic-number-field
  period: {from: 1871, to: 1871}
  perspective: historical
  certainty: high
  sources: [src-r009-dedekind-1871-avigad]
  claim: >
    In the 1871 supplement Dedekind treats a finite number field as a system closed under the four
    arithmetic operations and develops bases, conjugacy, norms, discriminants, and its algebraic integers.
- id: r009-a004
  subject: work-dedekind-1871-supplement
  predicate: contributed_to
  object: concept-dedekind-ideal
  period: {from: 1871, to: 1871}
  perspective: historical
  certainty: high
  sources: [src-r009-dedekind-1871-avigad]
  claim: >
    Dedekind identifies an ideal divisor with the system of algebraic integers divisible by it; these
    systems are closed under addition and under multiplication by arbitrary integers of the field.
- id: r009-a005
  subject: work-dedekind-1871-supplement
  predicate: contributed_to
  object: concept-prime-ideal
  period: {from: 1871, to: 1871}
  perspective: historical
  certainty: high
  sources: [src-r009-dedekind-1871-avigad]
  claim: >
    The 1871 presentation defines prime ideals through the divisibility ordering of ideals and proves a
    prime-ideal property analogous to the familiar prime-divisor property for products.
- id: r009-a006
  subject: work-dedekind-1871-supplement
  predicate: contributed_to
  object: concept-ideal-factorization
  period: {from: 1871, to: 1871}
  perspective: historical
  certainty: high
  sources: [src-r009-dedekind-1871-avigad]
  claim: >
    Dedekind proves that an ideal is determined by the highest powers of prime ideals dividing it and
    subsequently defines ideal multiplication, yielding the decomposition structure that replaces
    ordinary element factorization in the theory.
- id: r009-a007
  subject: work-dedekind-1871-supplement
  predicate: reframed
  object: work-dedekind-1879-supplement
  period: {from: 1871, to: 1879}
  perspective: later_interpretation
  certainty: high
  sources: [src-r009-avigad-2004]
  claim: >
    Dedekind published substantially revised presentations of ideal theory; the later versions moved
    away from the 1871 dependence on 'simple ideals' and particular congruence representations toward
    a more abstract treatment of ideals and their operations.
- id: r009-a008
  subject: work-dedekind-1879-supplement
  predicate: reframed
  object: work-dedekind-1894-supplement
  period: {from: 1879, to: 1894}
  perspective: later_interpretation
  certainty: high
  sources: [src-r009-avigad-2004, src-r009-sep-dedekind]
  claim: >
    Ideal theory was not a single frozen 1871 formulation: Dedekind repeatedly revised the exposition,
    with versions in 1871, 1877, 1879, and 1894.
- id: r009-a009
  subject: person-kronecker
  predicate: contributed_to
  object: concept-ideal-factorization
  period: {from: 1850, to: 1891}
  perspective: historical
  certainty: high
  sources: [src-r009-avigad-2004, src-r009-edwards-1980]
  claim: >
    Kronecker developed a distinct, explicitly computational approach to the extension of ideal
    factorization, so Dedekind's set/system-based formulation should not be narrated as the only
    contemporary route.
- id: r009-a010
  subject: concept-dedekind-ideal
  predicate: contributed_to
  object: concept-ideal-factorization
  period: {from: 1871, to: 1894}
  perspective: modern_abstraction
  certainty: high
  sources: [src-r009-dedekind-1871-avigad, src-r009-avigad-2004]
  claim: >
    In modern terminology, Dedekind's systems satisfy the familiar ideal closure conditions in the ring
    of integers of a number field, and nonzero ideals admit unique prime-ideal factorization; this is a
    modern reformulation of the historical theory, not Dedekind's later ring-theoretic vocabulary.
- id: r009-a011
  subject: concept-algebraic-number-field
  predicate: contributed_to
  object: concept-dedekind-ideal
  period: {from: 1871, to: 1894}
  perspective: historical
  certainty: high
  sources: [src-r009-dedekind-1871-avigad]
  claim: >
    Dedekind's ideal theory is formulated relative to the system of algebraic integers of a finite
    algebraic number field, rather than as a theory of ideals in arbitrary rings.
- id: r009-a012
  subject: person-dedekind
  predicate: contributed_to
  object: concept-algebraic-number-field
  period: {from: 1871, to: 1871}
  perspective: historical
  certainty: medium
  sources: [src-r009-dedekind-1871-avigad]
  claim: >
    Dedekind's 1871 discussion explicitly notes a connection from the finite-field framework to principles
    introduced by Galois, but this local textual connection does not by itself establish a simple historical
    chain from Galois's solvability problem to Dedekind's ideal theory.

