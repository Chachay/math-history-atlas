uncertainties:
- id: r009-u001
  issue: >
    The packet has not established a direct causal line from R006's equation-solvability problem to
    Dedekind's ideal theory. Dedekind's explicit reference to Galois occurs inside his field discussion,
    but that is not sufficient evidence that Galois theory motivated the ideal construction.
  impact: >
    Any R006↔R009 Story connection should be an intersection or later synthesis unless stronger evidence
    is found.
- id: r009-u002
  issue: >
    The exact chronology and conceptual differences among Dedekind's 1877, 1879, and 1894 formulations
    deserve edition-by-edition primary-source checking beyond the 1871 translation and secondary overview.
  impact: >
    The Story may safely say that Dedekind revised the theory repeatedly, but should avoid detailed claims
    about each edition unless separately evidenced.
- id: r009-u003
  issue: >
    Kronecker's divisor theory is represented mainly through specialist secondary comparison in this
    packet rather than a primary-source reconstruction.
  impact: >
    Kronecker should appear as a historically real alternative route, but detailed technical contrasts
    should remain limited or become a supplementary evidence gap.
- id: r009-u004
  issue: >
    Modern statements using 'ring of integers', 'module', 'Dedekind domain', and textbook unique
    factorization of ideals compress historical changes in terminology and proof organization.
  impact: >
    These terms may be used only under modern_abstraction perspective or with explicit qualification.
