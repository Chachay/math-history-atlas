research_unit:
  id: R009
  title: Dedekind — failure of unique factorization, ideals, and algebraic number structure
  period:
    approximate_start: 1840
    approximate_end: 1895
    core_period: 1844–1894
  scope_summary: >
    Investigation of the nineteenth-century factorization problem in algebraic number theory from
    Kummer's ideal divisors for cyclotomic integers through Dedekind's 1871 ideal theory and its
    revisions in 1877, 1879, and 1894. The packet follows the internal mathematical tension created
    when element factorization ceases to behave like rational-integer arithmetic, and asks what
    replacement objects restore a usable decomposition theory. It distinguishes Dedekind's historical
    systems of algebraic integers and ideals from later ring-theoretic language, and treats the
    relationship to R006's Galois/equation branch as a possible intersection rather than a causal chain.
  origin_pattern: internal_mathematical_development
  prior_mathematical_problem: >
    Arithmetic in algebraic-number domains did not in general retain the familiar unique decomposition
    of rational integers into primes. Kummer addressed this in cyclotomic settings by reasoning with
    ideal divisors; Dedekind and Kronecker later sought theories applicable more generally.
  generated_date: '2026-08-21'
  research_status: researched
  editorial_status: not_accepted

research_questions:
- id: q001
  question: What factorization failure was historically at issue in algebraic number theory before Dedekind's ideal theory?
- id: q002
  question: What did Kummer's ideal divisors accomplish, and what was the scope of his construction?
- id: q003
  question: How did Dedekind's 1871 ideal theory turn divisibility conditions into systems of algebraic integers?
- id: q004
  question: How did Dedekind's presentation change between 1871 and the 1877, 1879, and 1894 versions?
- id: q005
  question: In what historical sense did factorization become recoverable at the level of ideals?
- id: q006
  question: How should fields, algebraic integers, bases, modules, and ideals be described without projecting later abstract algebra backward?
- id: q007
  question: How did Dedekind's and Kronecker's approaches differ, and why should neither be presented as the inevitable path?
- id: q008
  question: Is there evidence for a historical R006 Galois-solvability → Dedekind-ideal chain, or only a broader algebraic-number intersection?

