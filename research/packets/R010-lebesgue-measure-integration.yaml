uncertainties:
- id: r010-u001
  issue: 'The exact proof-level lineage from Cantor''s 1870–1872 exceptional/derived-set work to Borel''s
    1898 measurable sets and then to Lebesgue''s integration theory is not established here.

    '
  consequence: 'Do not promote a direct R008→R010 historical transition without stronger specialist or
    primary evidence.

    '
- id: r010-u002
  issue: 'The pedagogical phrase ''Riemann partitions the domain; Lebesgue partitions the range'' compresses
    the 1901 construction and can hide the essential role of measuring inverse-image sets.

    '
  consequence: 'Story prose may use the contrast only with qualification and primary-source-backed detail.

    '
- id: r010-u003
  issue: 'The 1901 note states strong closure and limiting properties in compressed form; later named
    convergence theorems have refined hypotheses and should not be back-attributed without separate research.

    '
  consequence: 'Keep dominated convergence, monotone convergence as modern named theorems, and Lp theory
    outside the first-phase story unless directly evidenced and dated.

    '
