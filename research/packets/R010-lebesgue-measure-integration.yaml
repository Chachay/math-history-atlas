chronology:
- date: '1892'
  date_type: publication
  event: 'Camille Jordan publishes Remarques sur les intégrales définies, developing a set-content approach
    within a discussion of definite integration; later terminology commonly calls this Jordan content
    or Jordan measure.

    '
  perspective: historical
  certainty: high
  sources:
  - src-jordan-1892
  - src-eom-jordan-measure
  uncertainty: 'Modern descriptions in terms of boundaries of Lebesgue measure zero are retrospective
    and are not used as Jordan''s own formulation here.

    '
- date: '1898'
  date_type: publication
  event: 'Émile Borel publishes Leçons sur la théorie des fonctions, including a chapter on perfect and
    measurable sets and extending length to a substantially broader family of point sets using countable
    operations.

    '
  perspective: historical
  certainty: high
  sources:
  - src-borel-1898
  - src-hawkins-1979
  uncertainty: 'The modern statement that Borel thereby defined a measure on the sigma-algebra generated
    by intervals is mathematically accurate as a retrospective reconstruction but is not used as his historical
    wording.

    '
- date: '1901-04-29'
  date_type: academy_presentation_and_publication
  event: 'Lebesgue''s note Sur une généralisation de l''intégrale définie is presented by Picard to the
    Académie des sciences. Lebesgue states that Riemann''s integral does not integrate every derivative
    and proposes a broader integral that contains Riemann''s as a special case and addresses the primitive-function
    problem.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1901
- date: '1901-04-29'
  date_type: publication
  event: 'In the same note Lebesgue defines the measure of a set through countable open coverings and
    defines integration by subdividing the range of function values and measuring the corresponding sets
    of arguments.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1901
  uncertainty: 'This is described in Lebesgue''s own one-dimensional language. Modern outer-measure and
    measurable-function terminology can explain it later but should not replace the historical formulation.

    '
- date: '1902'
  date_type: doctoral_thesis_publication
  event: 'Lebesgue publishes Intégrale, longueur, aire as his Paris doctoral thesis, with separate chapters
    on measure of sets and integration and a much fuller development of the 1901 construction.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1902-sorbonne
assertions:
- id: r010-a001
  subject: work-lebesgue-generalization-1901
  predicate: raised_question
  object: concept-riemann-integral
  statement: 'Lebesgue explicitly identifies a limitation of Riemann integration: not every derivative
    is Riemann-integrable, so integration in Riemann''s sense does not by itself solve the search for
    primitive functions.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1901
  uncertainty: null
- id: r010-a002
  subject: work-lebesgue-generalization-1901
  predicate: generalized
  object: concept-lebesgue-integral
  statement: 'Lebesgue states as a design requirement that the new integral include the Riemann integral
    as a special case while permitting recovery of primitives in cases excluded by Riemann integration.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1901
  uncertainty: 'This is Lebesgue''s stated aim in the 1901 note, not a claim that all later integration
    problems were thereby solved.

    '
- id: r010-a003
  subject: person-jordan
  predicate: contributed_to
  object: concept-jordan-content
  statement: 'Jordan''s 1892 work forms an important pre-Lebesgue stage in relating definite integration
    to the content of point sets.

    '
  perspective: later_interpretation
  certainty: high
  sources:
  - src-jordan-1892
  - src-hawkins-1979
  - src-eom-jordan-measure
  uncertainty: 'Peano also belongs to the development of set content; this assertion does not assign sole
    priority to Jordan.

    '
- id: r010-a004
  subject: person-borel
  predicate: contributed_to
  object: concept-borel-measure
  statement: 'Borel''s 1898 book extends the assignment of length from intervals to a wider family of
    point sets through countable set operations, providing a major immediate predecessor to Lebesgue''s
    measure work.

    '
  perspective: historical
  certainty: high
  sources:
  - src-borel-1898
  - src-hawkins-1979
  uncertainty: 'The phrase Borel measure is an Atlas label; Borel''s own construction should not be silently
    rewritten in modern sigma-algebra language.

    '
- id: r010-a005
  subject: work-lebesgue-generalization-1901
  predicate: generalized
  object: concept-lebesgue-measure
  statement: 'Lebesgue defines the measure of a point set using countable open coverings and uses measurable
    sets as the basic set-theoretic material from which his generalized integral is built.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1901
  - src-lebesgue-1902-sorbonne
  uncertainty: 'Modern outer measure and completion language is deliberately omitted from the historical
    wording.

    '
- id: r010-a006
  subject: work-lebesgue-generalization-1901
  predicate: contributed_to
  object: concept-lebesgue-integral
  statement: 'Lebesgue''s construction partitions the range of function values and associates to each
    value band the set of arguments where the function falls in that band; the integral is obtained from
    sums involving the measures of those argument sets.

    '
  perspective: historical
  certainty: high
  sources:
  - src-lebesgue-1901
  uncertainty: 'The common slogan that Riemann partitions the domain while Lebesgue partitions the range
    is useful only if it remains an explanatory compression of this construction rather than a complete
    historical definition.

    '
