research_unit:
  id: R010
  title: Lebesgue — measure, integration, and functions beyond Riemann's boundary
  period:
    approximate_start: 1870
    approximate_end: 1910
    core_period: 1892–1902
  scope_summary: 'Investigation of the transition from late nineteenth-century definite integration and
    set content to Lebesgue''s 1901–1902 measure-and-integral construction. The unit centers Jordan and
    Borel as intermediaries, Lebesgue''s explicit concern with limitations of Riemann integration for
    recovering primitives, and the conceptual use of sets of arguments corresponding to ranges of function
    values. It does not retroject modern sigma-algebra language, abstract measure spaces, Lp theory, or
    the later canonical convergence theorems into Lebesgue''s earliest formulation. A possible Cantor/point-set
    intersection is treated as a historical question requiring evidence rather than as an automatic chain.

    '
  origin_pattern: internal_mathematical_development_with_cross_field_recombination
  prior_mathematical_problem: 'Riemann had made integrability itself an explicit mathematical object and
    admitted highly discontinuous examples, but his integral did not encompass every bounded derivative.
    By the 1890s Jordan and Borel were also developing ways to assign content or measure to increasingly
    general point sets.

    '
  generated_date: '2026-08-21'
  research_status: researched
  editorial_status: not_accepted
research_questions:
- id: q001
  question: Which limitations of Riemann-style integration were explicit for Lebesgue around 1901?
- id: q002
  question: What did Jordan's content and Borel's measurable-set work contribute before Lebesgue?
- id: q003
  question: How did Lebesgue define measure in his 1901 note and 1902 thesis without modern sigma-algebra
    terminology?
- id: q004
  question: How did Lebesgue's construction reorganize integration around sets associated with ranges
    of function values?
- id: q005
  question: What class of functions did the early Lebesgue integral aim to include beyond the Riemann-integrable
    class?
- id: q006
  question: Which convergence claims belong to Lebesgue's earliest work, and which belong to later textbook
    formulation?
- id: q007
  question: How strong is the historical connection from Cantor's point-set work through Borel to Lebesgue
    measure?
- id: q008
  question: Which modern measure-theoretic terms are retrospective abstractions rather than Lebesgue's
    1901–1902 vocabulary?
