findings:
- id: hr-r009-001
  classification: REVISE
  target:
    section: assertions
    id: r009-a001
  reason: >
    The mathematical substance is sound, but the wording makes 1847 look like the first public
    introduction. Recent source-level historiography dates Kummer's public overview to March 1846;
    the 1847 Crelle paper reprinted that overview with changes. The packet should distinguish first
    communication from journal republication.
  evidence:
  - source_id: src-r009-chemla-2024
    locator: p. 2
    supports: first_publication_date
  proposed_change:
    action: replace_fields
    fields:
      period: {from: 1846, to: 1847}
      claim: >
        Kummer publicly outlined his ideal-divisor theory in 1846 and republished the overview with
        changes in Crelle's Journal in 1847; the theory introduced ideal divisors/ideal complex numbers
        in cyclotomic arithmetic to recover prime-factor reasoning unavailable from ordinary factors.

- id: hr-r009-002
  classification: PASS
  target: {section: assertions, id: r009-a002}
  reason: >
    Avigad's introduction explicitly contrasts Kummer's indirect divisibility predicates with Dedekind's
    identification of an ideal divisor with the system of integers it divides and places Dedekind and
    Kronecker as later extensions of Kummer's program.
  evidence:
  - {source_id: src-r009-avigad-2004, locator: 'pp. 1–3', supports: historical_relation}

- id: hr-r009-003
  classification: PASS
  target: {section: assertions, id: r009-a003}
  reason: >
    The 1871 text itself defines fields through arithmetic closure and develops bases, conjugacy, norms,
    discriminants, and integers of the field. The packet does not substitute modern abstract field theory
    for the source's terminology.
  evidence:
  - {source_id: src-r009-dedekind-1871-avigad, locator: 'pp. 11–16, 33–35', supports: field_framework}

