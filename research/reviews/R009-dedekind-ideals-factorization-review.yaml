- id: hr-r009-009
  classification: WEAK_EVIDENCE
  target:
    section: assertions
    id: r009-a009
  reason: >
    The existence of a distinct Kroneckerian route is well supported by specialist historiography and
    Avigad's overview, but the packet does not inspect a primary Kronecker source. The broad alternative-
    route claim is defensible; detailed claims about Kronecker's method should not be promoted from this
    evidence base.
  evidence:
  - {source_id: src-r009-avigad-2004, locator: 'pp. 1–3', supports: distinct_computational_approach}
  - {source_id: src-r009-edwards-1980, locator: 'article scope', supports: comparative_history}
  proposed_change:
    action: replace_fields
    fields:
      certainty: medium
      claim: >
        Specialist histories describe Kronecker as developing a distinct, explicitly computational
        approach to the extension of ideal factorization. This is sufficient to prevent narrating
        Dedekind's formulation as the only contemporary route, but not to reconstruct Kronecker's
        technical theory here.

