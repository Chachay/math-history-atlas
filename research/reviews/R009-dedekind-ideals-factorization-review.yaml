- id: hr-r009-012
  classification: REVISE
  target:
    section: assertions
    id: r009-a012
  reason: >
    The source supports a specific textual connection: while discussing conjugate finite fields Dedekind
    says that pursuing the topic leads to principles introduced by Galois. The current canonical-style
    predicate 'contributed_to' from Dedekind to the number-field concept is too vague for the actual point
    and risks being read as a stronger genealogy. Preserve the evidence as an intersection claim rather
    than a causal assertion.
  evidence:
  - {source_id: src-r009-dedekind-1871-avigad, locator: 'p. 15 n.14', supports: explicit_galois_reference}
  proposed_change:
    action: replace_fields
    fields:
      perspective: later_interpretation
      certainty: medium
      claim: >
        Dedekind's 1871 discussion of conjugate finite fields explicitly remarks that pursuing those
        questions leads to principles introduced by Galois. This supports a textual intersection around
        fields and conjugacy, but not a claim that Galois's solvability problem motivated Dedekind's
        construction of ideals.

