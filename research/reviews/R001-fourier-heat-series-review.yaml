review:
  research_unit_id: R001
  title: "Historical Critic review — Fourier — heat propagation and trigonometric representation"
  critic_version: "historical-critic-v1"
  review_date: "2026-08-20"
  overall_status: REVISE
  summary: >
    The packet's broad architecture is substantially sound: Fourier's heat theory
    required representation of prescribed temperature data; Fourier made broad
    claims about trigonometric representation; Dirichlet's 1829 paper is a direct
    downstream response to the convergence problem; and the vibrating-string
    controversy is an essential predecessor. The most serious factual error is the
    chronology assigned to Cauchy's memoir on periodic series. Several other items
    overstate causal transitions, use modern explanatory language while retaining a
    historical perspective tag, or attribute a unified anti-Fourier position to
    Laplace more strongly than the available evidence warrants.

classification_counts:
  assertions:
    PASS: 19
    REVISE: 6
    WEAK_EVIDENCE: 1
    REJECT: 0
  question_transitions:
    PASS: 2
    REVISE: 3
    WEAK_EVIDENCE: 0
    REJECT: 0

critical_global_findings:
  - id: gf001
    classification: REJECT
    severity: high
    finding: >
      The chronology entry dated "1823" for Cauchy's memoir on periodic series
      conflates the nominal year attached to volume 6 of the Mémoires de l'Académie
      des sciences with the memoir's actual read and publication dates.
    required_change: >
      Replace the 1823 event date with a chronology that distinguishes the dates:
      the memoir was read to the Académie on 27 February 1826 and published in
      1827 in volume 6, a volume whose bibliographic series label is associated with
      1823. Do not state that Cauchy "publishes" this memoir in 1823.
    evidence:
      - source_id: src-cauchy-periodic-series
        locator: "first page; heading and note 'Lu à l’Académie royale des Sciences, le 27 février 1826'"
        supports: "read_date"
      - source_id: src-cauchy-periodic-series
        locator: "bibliographic record for Mémoires de l'Académie des sciences, vol. 6, pp. 603–612"
        supports: "publication_year_and_volume_year_distinction"

  - id: gf002
    classification: REVISE
    severity: high
    finding: >
      The packet's persistent source records still contain a session-specific
      retrieval field. That field is incompatible with the packet's own persistent
      evidence design even though the stable source IDs and URLs are otherwise usable.
    required_change: >
      Remove every session-specific retrieval field from the packet's sources
      section. Retain stable source IDs, bibliographic metadata, persistent URLs,
      and, where useful, page/article locators.
    evidence: []

  - id: gf003
    classification: REVISE
    severity: medium_high
    finding: >
      The packet sometimes treats Lagrange and Laplace as a single bloc of critics
      of Fourier's trigonometric representation. The cited secondary record is not
      internally uniform on Laplace: one cited summary says both Lagrange and Laplace
      objected, while the MIT Press description of the Grattan-Guinness/Ravetz study
      states that Fourier had Laplace's support among the examiners and that Lagrange
      was adamantly opposed.
    required_change: >
      Treat Lagrange's opposition as well supported, but qualify Laplace's precise
      position by issue and date. Separate possible objections to physical derivation,
      mathematical proof, and publication. Do not write "Lagrange and Laplace rejected
      Fourier's series" without manuscript-level or issue-specific evidence.
    evidence:
      - source_id: src-mactutor-fourier
        locator: "discussion of the 1807 committee and objections"
        supports: "secondary_account_attributing_series_objection_to_lagrange_and_laplace"
      - source_id: src-grattan-guinness-ravetz-1972
        locator: "MIT Press description of the critical study"
        supports: "secondary_account_describing_laplace_as_supportive_and_lagrange_as_opposed"

  - id: gf004
    classification: REVISE
    severity: medium
    finding: >
      Several claims correctly explain Fourier's mathematics using separated modes,
      eigenfunctions, or a formal-expansion-versus-convergence distinction, but some
      are tagged as historical even when the wording is substantially retrospective.
    required_change: >
      Either rewrite those items in terminology grounded in Fourier's own text, or
      change their perspective to modern_abstraction or later_interpretation. Do not
      allow a historical perspective tag to imply that Fourier framed the problem in
      later PDE or spectral-theory vocabulary.
    evidence:
      - source_id: src-fourier-1822-section207
        locator: "art. 207"
        supports: "Fourier's own transition from heat problems to trigonometric development"
      - source_id: src-fourier-1822-art235
        locator: "art. 235"
        supports: "Fourier's own statement of arbitrary-function representation and necessity for heat theory"

chronology_reviews:
