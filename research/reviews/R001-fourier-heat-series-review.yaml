  - source_id: src-dirichlet-1829
    assessment: strong
    note: >
      Directly supports the absence of a prior general convergence proof, the
      existence of Cauchy's attempt, and both detailed objections summarized in
      the packet.
    web_evidence:
      - "citeturn434522view0"

  - source_id: src-herreman-2013
    assessment: strong_for_comparative_historiography
    note: >
      Strong support for comparing Fourier's inauguration of trigonometric-series
      representation with the earlier vibrating-string controversy. It should not
      automatically be treated as evidence of a specific eighteenth-century
      actor's motive for objecting to Fourier in 1808.
    web_evidence:
      - "citeturn724757search1"

  - source_id: src-mactutor-fourier
    assessment: useful_secondary_but_not_final_authority
    note: >
      Supports committee composition, reported objections, Biot's role, and the
      1811 prize episode. For fine-grained attribution of motives or precise
      chronology, replace or supplement with manuscript-level/critical-edition evidence.
    web_evidence:
      - "citeturn724757search0"

  - source_id: src-smithsonian-fourier
    assessment: insufficient_for_mathematical_content
    note: >
      A catalog record can establish bibliographic facts about the critical
      edition but should not be cited as evidence that particular mathematical
      content occurred in the 1807 memoir.
    web_evidence:
      - "citeturn233335search4"

  - source_id: src-poincare-value-science
    assessment: strong_as_later_testimony_not_contemporary_evidence
    note: >
      Poincaré explicitly links Fourier's heat problem, discontinuous functions,
      and widening of the function notion. Because it dates from 1905, it supports
      later_interpretation claims, not Fourier's own motivation or immediate reception.
    web_evidence:
      - "citeturn228537search0"

recommended_packet_changes:
  - priority: 1
    change: >
      Correct the Cauchy chronology by distinguishing nominal volume year 1823,
      Academy reading date 1826-02-27, and publication year 1827.
  - priority: 2
    change: >
      Retag r001-a004, r001-qt001, and r001-qt002 as historical_reconstruction or
      modern_abstraction unless direct textual evidence is added for the exact
      modernized causal sequence.
  - priority: 3
    change: >
      Split r001-a012 into separately dated Biot claims concerning derivation and priority.
  - priority: 4
    change: >
      Separate Lagrange's documented 1808 objection from any claim that his
      vibrating-string position caused or motivated that objection.
  - priority: 5
    change: >
      Add an authoritative modern PDE/spectral source for r001-a024 rather than
      asking Fourier's 1822 text to support eigenfunction terminology.
  - priority: 6
    change: >
      Replace 'exceptional sets' in r001-a022 with source-faithful wording unless
      a specialist Riemann source is added.

final_verdict:
  classification: REVISE
  rationale: >
    The packet should not be rejected. Its central historical claims are unusually
    well grounded in Fourier's and Dirichlet's own texts. It nevertheless needs
    revision before acceptance because several edges convert modern mathematical
    reconstruction into historical motivation, some personal attributions are
    too compressed, one modern spectral claim is under-cited, and the Cauchy date
    is materially mislabeled. After those corrections, the packet would provide a
    strong basis for downstream Stories without forcing a simplistic
    Fourier-to-Cauchy-to-Riemann narrative.
