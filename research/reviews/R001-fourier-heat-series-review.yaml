    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-function-conception
        locator: "p. 552, discussion of arbitrary ordinates and discontinuous functions"
        supports: "non_common_law_and_discontinuous_functions"

  - id: r001-a009
    classification: PASS
    reason: >
      The packet accurately reports Fourier's historical assertion while explicitly
      warning that it is false at unrestricted modern generality.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-convergence-claim
        locator: "p. 259, item 1°"
        supports: "fourier_always_convergent_claim"

  - id: r001-a010
    classification: PASS
    reason: >
      Lagrange's opposition is well supported and the statement prudently avoids
      attributing every committee objection uniquely to him. The connection to the
      vibrating-string controversy is historical background rather than proof of a
      specific motive.
    needed_evidence: null
    evidence:
      - source_id: src-herreman-2013
        locator: "comparison of Lagrange, vibrating strings, and Fourier"
        supports: "lagrange_intellectual_background"
      - source_id: src-grattan-guinness-ravetz-1972
        locator: "1807 reception"
        supports: "lagrange_opposition"

  - id: r001-a011
    classification: WEAK_EVIDENCE
    reason: >
      The statement is deliberately cautious, but the cited secondary accounts do
      not yield a stable, issue-specific account of Laplace's early position. One
      source summary describes him as an objector; another describes him as a
      supporter among the examiners. "Associated with early concerns" is too vague
      to be a high-confidence historical assertion.
    needed_evidence: >
      Locate the committee record, Laplace's relevant memoirs, or correspondence and
      specify exactly whether the concern was about trigonometric representation,
      physical derivation of heat transfer, rigor, or publication.
    evidence:
      - source_id: src-mactutor-fourier
        locator: "1807–1809 reception summary"
        supports: "account_of_laplace_as_objector"
      - source_id: src-grattan-guinness-ravetz-1972
        locator: "MIT Press description"
        supports: "account_of_laplace_as_supporter"

  - id: r001-a012
    classification: REVISE
    reason: >
      The body of the statement is plausible, but the predicate "disputed" with the
      object "problem-heat-propagation" is too broad. Biot contested derivation and
      priority-related issues; he did not dispute the existence of heat propagation
      as a problem.
    needed_evidence: >
      Narrow the object to Fourier's derivation of the heat-transfer equations and,
      separately, the priority dispute concerning Biot's 1804 paper.
    evidence:
      - source_id: src-mactutor-fourier
        locator: "discussion of Biot's objection"
        supports: "biot_derivation_and_priority_dispute"

  - id: r001-a013
    classification: PASS
    reason: >
      The committee's reservations about generality and rigor are directly reported
      in the cited historical account and are not exaggerated.
    needed_evidence: null
    evidence:
      - source_id: src-mactutor-fourier
        locator: "1811 prize report"
        supports: "rigor_and_generality_reservations"

  - id: r001-a014
    classification: PASS
    reason: >
      The packet correctly rejects an origin story beginning with Fourier and points
      to the vibrating-string controversy as a predecessor.
    needed_evidence: null
    evidence:
      - source_id: src-herreman-2013
        locator: "full article"
        supports: "pre_fourier_history"

  - id: r001-a015
    classification: PASS
    reason: >
      Bernoulli's harmonic superposition claim is an appropriate predecessor, and
      the uncertainty field prevents anachronistically equating it with Fourier's
      later coefficient formulas or arbitrary-function framework.
    needed_evidence: null
    evidence:
      - source_id: src-herreman-2013
        locator: "vibrating-string discussion"
        supports: "bernoulli_harmonic_superposition"

  - id: r001-a016
    classification: PASS
    reason: >
      As a later interpretation, this is carefully delimited: it does not claim that
      Fourier invented sines, cosines, or every coefficient technique, but identifies
      the combination of systematic physical use, coefficient formulas, and broad
      prescribed-data representation.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-art235
        locator: "art. 235"
        supports: "systematic_general_data_representation"
      - source_id: src-herreman-2013
        locator: "comparison with predecessor traditions"
        supports: "historical_distinctiveness"

  - id: r001-a017
    classification: REVISE
    reason: >
      The claim itself is correct, but the packet elsewhere dates the relevant Cauchy
      memoir incorrectly. This assertion should be anchored to the memoir's actual
      1826 read date and 1827 publication rather than allowed to inherit the 1823 error.
    needed_evidence: >
      Add Cauchy's memoir itself and encode read date, publication year, and nominal
      volume year separately.
    evidence:
      - source_id: src-cauchy-periodic-series
        locator: "first page"
        supports: "cauchy_convergence_attempt_and_read_date"
      - source_id: src-dirichlet-1829
        locator: "opening criticism of Cauchy"
        supports: "cauchy_attempt_preceded_dirichlet"

  - id: r001-a018
    classification: PASS
    reason: >
      Dirichlet explicitly criticizes Cauchy's attempted convergence argument. The
      packet's description correctly distinguishes two defects: applicability of the
      analytic/complex substitution and an asymptotic comparison that does not prove
      convergence.
    needed_evidence: null
    evidence:
      - source_id: src-dirichlet-1829
        locator: "opening pages criticizing Cauchy's proof"
        supports: "dirichlet_critique_of_cauchy"

  - id: r001-a019
    classification: PASS
    reason: >
      The stated restrictions and midpoint value at jumps accurately capture the
      historical result at the packet's level of abstraction, while the uncertainty
      field warns against substituting later textbook hypotheses for Dirichlet's own.
    needed_evidence: null
    evidence:
      - source_id: src-dirichlet-1829
        locator: "theorem and discussion of discontinuities"
        supports: "dirichlet_conditions_and_jump_value"

  - id: r001-a020
    classification: REVISE
    reason: >
      "Fourier's representation program made convergence ... a major problem" is a
      causal historical synthesis stronger than the cited primary sources alone can
      establish. They do show that convergence of trigonometric representations became
      a major problem and that Dirichlet framed his work in that context.
    needed_evidence: >
      Reword to avoid sole-cause language, for example: "In the development of
      trigonometric representation after Fourier, convergence became a major problem
      in analysis." A stronger causal formulation requires historiography specifically
      arguing that Fourier's program produced that shift.
    evidence:
      - source_id: src-dirichlet-1829
        locator: "opening statement of the convergence problem"
        supports: "convergence_as_major_downstream_problem"
      - source_id: src-riemann-trig-translation
        locator: "historical introduction"
        supports: "later_centrality_of_trigonometric_series_problem"

  - id: r001-a021
    classification: REVISE
    reason: >
      The claim is plausible but causal. Fourier's text demonstrates a broad conception
      of arbitrary ordinates not governed by one common law; it does not by itself prove
      that his treatment "strongly contributed" to a nineteenth-century conceptual
      pressure. Riemann and Poincaré are retrospective witnesses, not direct evidence
      of a simple causal chain.
    needed_evidence: >
      Either weaken to a genealogical statement — Fourier's treatment became an
      important episode in later histories of the function concept — or add specialist
      historiography tracing the reception of Fourier's function language through
      Dirichlet and later analysts.
    evidence:
      - source_id: src-fourier-1822-function-conception
        locator: "p. 552"
        supports: "fourier_broad_function_language"
      - source_id: src-poincare-value-science
        locator: "Chapter V, analysis and physics"
        supports: "later_retrospective_connection"

  - id: r001-a022
    classification: PASS
    reason: >
      The statement keeps Riemann temporally downstream and does not imply that his
      integration and exceptional-set questions were Fourier's own research program.
    needed_evidence: null
    evidence:
      - source_id: src-riemann-trig-translation
        locator: "historical and analytical sections"
        supports: "riemann_extension_of_trigonometric_series_analysis"

  - id: r001-a023
    classification: PASS
    reason: >
      The claim is explicitly labeled modern_abstraction and accurately warns against
      mapping modern signal-processing frequency-domain ontology onto Fourier's heat
      problems, where trigonometric dependence is often spatial.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-ch3
        locator: "Chapter III solution forms"
        supports: "spatial_trigonometric_dependence_and_time_decay"

  - id: r001-a024
    classification: PASS
    reason: >
      As modern_abstraction, the eigenfunction-expansion interpretation is mathematically
      legitimate and the packet explicitly denies that Fourier used later spectral
      terminology.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-ch3
        locator: "Chapter III"
        supports: "mathematical_structure_later_read_as_eigenfunction_expansion"

  - id: r001-a025
    classification: REVISE
    reason: >
      Fourier explicitly states that the fundamental heat questions require reducing
      initial-temperature functions to trigonometric form, but "gave concrete physical
      force" is a broader causal-intellectual interpretation. The source establishes
      necessity within Fourier's method, not the magnitude of its historical force on
      the later function concept.
    needed_evidence: >
      Replace with a directly supported statement: Fourier's heat problems required him
      to admit broadly prescribed initial-temperature functions and seek trigonometric
      representations for them. Reserve stronger causal language for a historiographic
      source.
    evidence:
      - source_id: src-fourier-1822-art235
        locator: "art. 235"
        supports: "physical_problem_requires_representing_initial_temperature_functions"

  - id: r001-a026
    classification: PASS
    reason: >
      This is a sound corrective to an overcompressed genealogy. It names important
      predecessors and intermediaries while explicitly acknowledging that even the
      expanded chain remains selective.
    needed_evidence: null
    evidence:
      - source_id: src-herreman-2013
        locator: "vibrating-string predecessor tradition"
        supports: "pre_fourier_intermediaries"
      - source_id: src-dirichlet-1829
        locator: "opening and convergence proof"
        supports: "dirichlet_as_crucial_intermediate"
      - source_id: src-riemann-trig-translation
        locator: "historical introduction"
        supports: "later_riemannian_phase"

question_transition_reviews:
  - id: r001-qt001
    classification: PASS
    reason: >
      The transition is a faithful high-level reconstruction of Fourier's heat
      program and does not require a stronger causal claim than the chapter supports.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-ch3
        locator: "Chapter III"
        supports: "heat_problem_to_equations_and_conditions"

  - id: r001-qt002
    classification: REVISE
    reason: >
      The transition is mathematically correct but is tagged historical while using
      "separated solutions" and "modes," which are explicitly admitted to be modernized
      terms. The perspective and wording are inconsistent.
    needed_evidence: >
      Either change perspective to modern_abstraction or rewrite in Fourier's own
      idiom of particular trigonometric forms and the need to develop arbitrary
      prescribed functions in corresponding series.
    evidence:
      - source_id: src-fourier-1822-section207
        locator: "art. 207"
        supports: "transition_to_trigonometric_development"

  - id: r001-qt003
    classification: PASS
    reason: >
      Fourier explicitly moves from concrete heat problems to the general problem of
      developing an arbitrary function in trigonometric series. This transition is
      unusually well supported by his own text.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-section207
        locator: "art. 207"
        supports: "particular_heat_profile_to_general_representation_problem"
      - source_id: src-fourier-1822-art235
        locator: "art. 235"
        supports: "arbitrary_function_representation"

  - id: r001-qt004
    classification: REVISE
    reason: >
      Dirichlet clearly turns convergence into an explicit theorem problem, but the
      phrasing "represented formally" versus "actually converge" is a later analytical
      distinction rather than a verbatim contemporary transition attributable to
      Fourier. The packet's own uncertainty effectively admits this.
    needed_evidence: >
      Change perspective to later_interpretation or phrase the historical transition
      more narrowly: Dirichlet asks for sufficient conditions under which the
      trigonometric series associated with a function converges to the appropriate
      value.
    evidence:
      - source_id: src-dirichlet-1829
        locator: "opening statement and theorem"
        supports: "explicit_convergence_problem"

  - id: r001-qt005
    classification: REVISE
    reason: >
      Riemann's trigonometric-series work is genuinely connected to integration and
      representation, but the transition from discontinuous-function convergence to
      "what objects should analysis admit as functions" is a broad retrospective
      genealogy. It risks making a modern foundational question look like a single
      historically continuous research question.
    needed_evidence: >
      Split the transition: first, Riemann asks what integrability assumptions are
      sufficient for Fourier coefficient and representation questions; second, later
      historians connect this work to broader changes in the concept of function and
      real analysis.
    evidence:
      - source_id: src-riemann-trig-translation
        locator: "historical introduction and integration discussion"
        supports: "riemann_trigonometric_series_and_integration"

required_packet_changes:
  - priority: 1
    change: >
      Correct the Cauchy chronology everywhere: read 1826-02-27; published 1827;
      volume 6 carries a nominal 1823 association. Remove any unqualified statement
      that Cauchy published the periodic-series convergence memoir in 1823.
  - priority: 2
    change: >
      Remove all session-specific retrieval fields from persistent source records.
  - priority: 3
    change: >
      Rework Laplace claims so that Lagrange's documented opposition is not silently
      generalized into a uniform Lagrange-and-Laplace rejection narrative.
  - priority: 4
    change: >
      Reclassify or rewrite historical items that depend on modern language such as
      separated modes or formal expansion versus convergence.
  - priority: 5
    change: >
      Weaken causal claims connecting Fourier to the later convergence problem and
      modern function concept unless specialist historiography directly supports the
      causal strength asserted.

