  - date: "1823"
    classification: REJECT
    reason: >
      This is a date-type error. Cauchy's memoir was not read or published in 1823.
      It was read on 27 February 1826 and published in 1827. The number 1823 belongs
      to the nominal year associated with the Academy volume and cannot be used as
      the event date without qualification.
    needed_evidence: >
      Use the memoir itself or a bibliographic record that gives read date,
      publication year, volume number, and nominal volume year separately.
    evidence:
      - source_id: src-cauchy-periodic-series
        locator: "first page and bibliographic metadata"
        supports: "read_date_publication_year_and_volume_year"

  - date: "1829"
    classification: PASS
    reason: >
      Dirichlet's 1829 paper directly addresses convergence of trigonometric series
      representing arbitrary functions and identifies defects in Cauchy's attempt.
      The packet appropriately qualifies the phrase "first rigorous proof."
    needed_evidence: null
    evidence:
      - source_id: src-dirichlet-1829
        locator: "opening discussion and theorem development"
        supports: "dirichlet_convergence_result"

  - date: "1854 / 1867"
    classification: PASS
    reason: >
      The packet clearly marks Riemann as downstream and outside the core period,
