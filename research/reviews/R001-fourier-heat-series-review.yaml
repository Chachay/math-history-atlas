      motivation. The cited Fourier passages establish the mathematical route and
      the need to represent prescribed data, not this exact modern causal framing.
    needed_evidence: >
      Either cite a passage where Fourier himself explicitly gives this sequence of
      motivation, or recast the statement as modern_abstraction: the equations admit
      trigonometric spatial factors, and the initial data then have to be expanded in
      the same trigonometric forms.
    evidence:
      - source_id: src-fourier-1822-section207
        locator: "art. 207"
        supports: "mathematical_transition_to_arbitrary_trigonometric_expansion"
      - source_id: src-fourier-1822-art235
        locator: "art. 235"
        supports: "necessity_of_reducing_initial_temperature_functions"

  - id: r001-a005
    classification: PASS
    reason: >
      This is very close to Fourier's explicit statement that the fundamental heat
      questions cannot be completely solved without reducing initial-temperature
      functions to trigonometric-series form.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-art235
        locator: "art. 235, sentence beginning 'On ne peut résoudre entièrement...'"
        supports: "explicit_necessity_claim"

  - id: r001-a006
    classification: PASS
    reason: >
      Fourier does give definite-integral coefficient formulas. The uncertainty
      field appropriately avoids an unsupported absolute-priority claim.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-art219-221
        locator: "arts. 219–221"
        supports: "integral_coefficient_formulas"

  - id: r001-a007
    classification: PASS
    reason: >
      Fourier explicitly speaks of a function represented on a finite interval by
      the ordinate of an arbitrarily drawn curve and says it can be developed into
      trigonometric series. The warning against a modern unrestricted set-theoretic
      reading is necessary and sufficient here.
    needed_evidence: null
    evidence:
      - source_id: src-fourier-1822-art235
        locator: "art. 235"
        supports: "arbitrarily_drawn_curve_and_trigonometric_development"

  - id: r001-a008
    classification: PASS
    reason: >
      Fourier explicitly says the ordinates need not be subject to a common law and
