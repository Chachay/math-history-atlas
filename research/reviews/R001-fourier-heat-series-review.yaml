- id: f-chronology-cauchy
  classification: REVISE
  reviewed_item:
    section: chronology
    match:
      date: '1823'
  target:
    section: chronology
    match:
      date: '1823'
  reason: The entry conflates three different dates. '1823' is the nominal year attached to volume 6 of the Mémoires de l'Académie; Cauchy's memoir itself states that it was read to the Académie on 27 February 1826, and bibliographic records identify publication in 1827. Calling 1823 the publication date is therefore historically incorrect.
  needed_evidence: Direct bibliographic and first-page evidence for read date and publication date.
  evidence:
  - source_id: src-cauchy-periodic-series-1827
    locator: p. 603, title heading
    supports: 'read_date: 1826-02-27'
  - source_id: src-cauchy-periodic-series-biblio
    locator: bibliography entry [17]
    supports: 'volume_year: 1823 and publication_year: 1827'
  - source_id: src-dirichlet-1829
    locator: opening paragraphs
    supports: Dirichlet's later criticism of Cauchy's memoir
  proposed_change:
    action: replace_entry
    value:
      volume_year: 1823
      read_date: '1826-02-27'
      publication_year: 1827
      event: Cauchy presents and later publishes an attempted general treatment of convergence of periodic/trigonometric series; Dirichlet later argues that the proof is insufficient.
      perspective: historical
      certainty: high
      sources:
      - src-cauchy-periodic-series-1827
      - src-dirichlet-1829
      uncertainty: The memoir appears in volume 6 nominally labeled for the year 1823, but the memoir itself was read on 27 February 1826 and the volume was published in 1827. These date types must not be conflated.
