- finding_id: hr-r004-a006
  critic_classification: REVISE
  human_decision: accept_critic
  human_note: 'Accepted. Use Riemann''s period-appropriate description of the rational discontinuity example
    in the historical assertion and retain dense/countable language only as explicit modern abstraction.

    '
  target:
    section: assertions
    id: r004-a006
  proposed_change:
    action: replace_fields
    fields:
      statement: 'Riemann explicitly investigates functions that are discontinuous infinitely often in
        every interval and constructs an example discontinuous at rational arguments which, in lowest
        terms, have an even denominator, while the function still satisfies his criterion for definite
        integration.

        '
      uncertainty: 'Modern descriptions of these discontinuity points as a dense countable subset of the
        rationals are explanatory abstractions and should not be attributed to Riemann''s terminology.

        '
  status: proposed
- finding_id: hr-r004-a007
  critic_classification: REVISE
  human_decision: accept_critic
  human_note: 'Accepted. Limit the comparison to the finite-discontinuity hypothesis in Dirichlet''s main
    stated convergence conditions; do not reduce Dirichlet''s full 1829 admissibility discussion to that
    boundary.

    '
  target:
    section: assertions
    id: r004-a007
  proposed_change:
    action: replace_fields
    fields:
      statement: 'Compared with the finite-discontinuity hypothesis in Dirichlet''s main stated convergence
        conditions, Riemann''s example admits infinitely many discontinuities while remaining integrable
        in Riemann''s sense; this does not imply that Dirichlet''s entire 1829 admissibility discussion
        imposed finite discontinuity as a universal boundary.

        '
  status: proposed
